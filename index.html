<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2342d6">
<title>Raktári kereső</title>
<link rel="stylesheet" href="common.css?v=20">
<style>
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));overflow-x:hidden}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;padding:6px var(--s3);padding-top:calc(6px + env(safe-area-inset-top))}
.brand{flex:1;display:flex;align-items:center}
.logo{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;transition:transform .5s var(--spring)}
.logo:active{transform:rotate(-12deg) scale(.92)}
.top .chip{min-height:34px;padding:0 10px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-small);color:var(--mute);transition:color .3s}
.sync.off{color:var(--bad);font-weight:700}
main{max-width:720px;margin:0 auto;padding:var(--s3)}
#app{min-height:60vh}
#app[data-enter=R]{animation:slideInR .42s var(--ease-out)}
#app[data-enter=L]{animation:slideInL .42s var(--ease-out)}
#app[data-leave=L]{animation:outL .12s ease-in forwards}
#app[data-leave=R]{animation:outR .12s ease-in forwards}

.scan{position:relative}
.scan input{width:100%;font-size:21px;padding:13px 16px 13px 48px;border:2px solid var(--accent);border-radius:var(--r);background:var(--surface);letter-spacing:.3px;box-shadow:var(--sh);text-transform:uppercase;transition:box-shadow .25s,border-color .25s}
.scan input:focus{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent),var(--sh);outline:none}
.scan input::placeholder{color:var(--mute);letter-spacing:0;text-transform:none;font-size:17px}
.scan .lead{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--accent);pointer-events:none}
.scan.has-btn input{padding-right:116px}
.scan .addb{position:absolute;right:7px;top:7px;bottom:7px;min-height:0;padding:0 14px;animation:springIn .35s var(--ease-out)}
.scan.sm input{padding-top:10px;padding-bottom:10px;font-size:18px}

#res{margin-top:var(--s3)}
.hero{border-radius:var(--r);padding:var(--s4);color:var(--hero-ink);background:var(--hero-bg) radial-gradient(120% 90% at 100% 0%,rgb(255 255 255 / .2),transparent 60%);box-shadow:var(--sh)}
.anim .hero{animation:springIn .5s var(--ease-out)}
.hero.ok{--hero-bg:var(--ok-strong);--hero-ink:var(--ok-strong-ink)}
.hero.warn{--hero-bg:var(--warn-strong);--hero-ink:var(--warn-strong-ink)}
.hero.bad{--hero-bg:var(--bad-strong);--hero-ink:var(--bad-strong-ink)}
.hero.info{--hero-bg:var(--accent);--hero-ink:var(--accent-ink)}
.hero-top{display:flex;align-items:center;gap:var(--s2);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.hero-ico{width:30px;height:30px;border-radius:50%;background:rgb(255 255 255 / .22);display:grid;place-items:center}
.anim .hero-ico{animation:ripple .9s .15s}
.anim .hero-ico svg path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s .2s var(--ease-out) forwards}
.hero-top .aux{margin-left:auto;opacity:.9;letter-spacing:0;text-transform:none;font-weight:700}
.hero .idc{margin:var(--s3) 0 var(--s1)}
.hero .idc .idp{color:inherit;opacity:.85;font-size:clamp(19px,6.2vw,28px);font-weight:700}
.hero .idc .id4{margin:0;padding:0 14px;background:rgb(255 255 255 / .22);color:inherit;font-size:clamp(58px,20vw,92px);line-height:1.12;letter-spacing:.04em}
.anim .hero .idc .id4{animation:flashId .9s var(--ease-out)}
.hero.compact{padding:var(--s3) var(--s4)}
.hero.compact .idc{margin:var(--s2) 0 0}
.hero.compact .idc .idp{font-size:15px}
.hero.compact .idc .id4{font-size:clamp(36px,11vw,48px);padding:0 10px}
.hero.compact .pbar{margin-top:var(--s2)}
.hero.compact .hchips{margin-top:var(--s2)}
.hero-prod{margin-top:var(--s3);font-size:18px;font-weight:700;line-height:1.25}
.hero-sub{margin-top:2px;font-size:13px;opacity:.85}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s3)}
.hchip{background:rgb(255 255 255 / .2);padding:4px 11px;border-radius:999px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.hero-btn{margin-top:var(--s4);width:100%;min-height:58px;font-size:17px;border-radius:12px;border:0;background:var(--hero-ink);color:var(--hero-bg);font-weight:800;cursor:pointer}
.hero-btn:hover{filter:brightness(.95)}
.hero-btn.alt{background:rgb(255 255 255 / .2);color:var(--hero-ink)}
.hero-note{margin-top:var(--s2);font-size:14px;opacity:.92}
.alt-h{margin:var(--s4) var(--s1) var(--s2)}
.row-i{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-2)}
.row-i:last-child{border-bottom:0}
.row-i .rest{flex:1;min-width:0;display:grid;gap:4px;justify-items:start}
.row-i .idc{font-size:19px}
.row-i.dim{opacity:.6}
.row-i.best{background:var(--accent-soft)}

.idle{display:grid;justify-items:center;text-align:center;gap:var(--s2);padding:var(--s6) var(--s4)}
.idle .frame{width:128px;height:128px;border-radius:30px;border:2px dashed var(--accent-line);display:grid;place-items:center;color:var(--accent);position:relative;overflow:hidden;background:var(--accent-soft);margin-bottom:var(--s3);animation:springIn .55s var(--ease-out)}
.idle .frame.scanning::after{content:"";position:absolute;left:12px;right:12px;height:3px;border-radius:2px;background:var(--accent);animation:scanline 2.2s ease-in-out infinite}
@keyframes scanline{0%,100%{top:18%}50%{top:78%}}
.idle h2{margin:0;font-size:22px;letter-spacing:-.01em;animation:rise .5s .08s var(--ease-out) both}
.idle p{margin:0;color:var(--mute);animation:rise .5s .14s var(--ease-out) both}
.idle .btn{margin-top:var(--s3);animation:rise .5s .2s var(--ease-out) both}

.hist .row-i{padding:var(--s2) var(--s4);cursor:pointer;font-size:14px;flex-wrap:wrap}
.hist .row-i:hover{background:var(--accent-soft)}
.ver{text-align:center;color:var(--mute);font-size:11px;margin:var(--s5) 0 var(--s2);opacity:.7}

.lrow{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;cursor:pointer;min-height:54px;transition:background .15s}
.lrow:hover{background:var(--accent-soft)}
.lrow:active{background:var(--accent-line)}
.lrow .box{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,transform .3s var(--spring)}
.lrow[aria-pressed=true] .box{background:var(--ok-strong);border-color:var(--ok-strong);color:var(--ok-strong-ink);transform:scale(1.08)}
.lrow[aria-pressed=true] .t{opacity:.55}
.lrow .t{flex:1;min-width:0;transition:opacity .2s}
.lrow .t small{display:block;color:var(--mute)}
.contents{max-height:300px;overflow:auto}

/* dobozok: kompakt */
.tools{display:grid;gap:var(--s2)}
.swb{display:flex;align-items:center;gap:var(--s3);width:100%;padding:10px var(--s3) 10px var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;font-weight:700;transition:background .25s,border-color .25s,transform .18s var(--spring)}
.swb:active{transform:scale(.985)}
.swb[aria-checked=true]{border-color:var(--accent);background:var(--accent-soft)}
.swb .t{flex:1}
.swb .track{width:52px;height:30px;border-radius:999px;background:var(--mute);position:relative;flex:none;transition:background .25s}
.swb .track::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:999px;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .3);transition:transform .35s var(--spring),width .2s}
.swb:active .track::after{width:30px}
.swb[aria-checked=true] .track{background:var(--accent)}
.swb[aria-checked=true] .track::after{transform:translateX(22px)}
.swb[aria-checked=true]:active .track::after{transform:translateX(16px)}
.msg{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;padding:10px var(--s4);border-radius:var(--r-sm);font-weight:650;animation:springIn .35s var(--ease-out)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.warn{background:var(--warn-soft);color:var(--warn)}.msg.bad{background:var(--bad-soft);color:var(--bad)}
.seg{display:flex;gap:6px;margin:var(--s3) 0 var(--s2)}
.seg .chip{flex:1;justify-content:center;gap:6px;padding:0 8px}
.seg .n{font-variant-numeric:tabular-nums;opacity:.8}
.crow{display:flex;align-items:center;gap:var(--s3);padding:8px var(--s3) 8px var(--s3);border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .15s}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--accent-soft)}
.crow:active{background:var(--accent-line)}
.crow .idc{font-size:17px;flex:1;min-width:0}
.crow .frac{font-weight:800;font-variant-numeric:tabular-nums;color:var(--mute)}
.crow .frac.ok{color:var(--ok)}

nav.tabs{--i:0;position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
nav.tabs .ind{position:absolute;top:8px;bottom:calc(8px + env(safe-area-inset-bottom));left:12px;width:calc((100% - 24px) / 3);border-radius:var(--r-sm);background:var(--accent);transform:translateX(calc(var(--i) * 100%));transition:transform .5s var(--spring);box-shadow:0 8px 18px -10px var(--accent)}
nav.tabs button{position:relative;z-index:1;min-height:56px;border:0;border-radius:var(--r-sm);background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer;transition:color .3s,transform .18s var(--spring)}
nav.tabs button:active{transform:scale(.93)}
nav.tabs button[aria-selected=true]{color:var(--accent-ink)}
nav.tabs button svg{transition:transform .4s var(--spring)}
nav.tabs button[aria-selected=true] svg{transform:translateY(-1px) scale(1.12)}
.pbar{height:10px;border-radius:5px;background:rgb(255 255 255 / .25);overflow:hidden;margin-top:var(--s3)}
.pbar i{display:block;height:100%;background:var(--hero-ink);border-radius:5px;transition:width .6s var(--ease-out)}
.pl{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-2);flex-wrap:wrap;transition:background .3s,opacity .3s}
.pl:last-child{border-bottom:0}
.pl .pn{flex:1;min-width:150px;display:grid;gap:2px}
.pl.full{opacity:.55}
.pl.hl{animation:lineHl 1.2s var(--ease-out)}
@keyframes lineHl{0%{background:var(--ok-soft);transform:scale(1.015)}100%{background:transparent;transform:none}}
.stp{display:flex;align-items:center;gap:6px}
.stp .btn.xs{min-width:36px;min-height:36px;padding:0 8px}
.stp .qv{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}
.stp .qv b{font-size:20px}
.cdc{margin-bottom:var(--s3)}
.cdc.own{border-color:var(--accent)}
.cdh{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4)}
.cdh .rest{flex:1;min-width:0;display:grid;gap:4px;justify-items:start}
.cdh .idc{font-size:19px}
.cdt{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--line-2);background:var(--surface-2);padding:8px var(--s4);font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
.cdt .chev{transition:transform .35s var(--spring)}
.cdt[aria-expanded=true] .chev{transform:rotate(180deg)}
.needs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease-out)}
.needs.on{grid-template-rows:1fr}
.needs>.ni{overflow:hidden;min-height:0}
.need{display:flex;justify-content:space-between;gap:var(--s3);padding:8px var(--s4);border-top:1px solid var(--line-2);font-size:14px}
.need.is{background:var(--accent-soft);font-weight:700}
.need b{white-space:nowrap}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad-strong);color:var(--bad-strong-ink);font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.badge.pop{animation:badgePop .45s var(--spring)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg></span></div>
  <span class="sync" id="sync" role="status" aria-live="polite"></span>
  <button class="chip" id="dev" aria-label="Eszköz neve"></button>
  <button class="chip" id="mut" aria-label="Hang be/ki"></button>
</header>
<main><div id="app"></div></main>
<nav class="tabs" id="tabs" role="tablist" aria-label="Nézetek"><span class="ind"></span></nav>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="common.js?v=20"></script>
<script>
const ORDER = ['scan', 'ident', 'cartons'];
let view = ORDER.includes(ls.get('rk_view')) ? ls.get('rk_view') : 'scan';
let device = ls.get('rk_device') || '';
let muted = ls.get('rk_mute') === '1';
let last = null, loading = true, animNext = false;
let hist = []; try { hist = JSON.parse(ls.get('rk_hist') || '[]'); } catch (e) {}
let cf = {st: 'open', q: '', add: false, msg: null};
let shellView = '';
const app = $('#app');

// ---------- visszajelzes ----------
let actx;
function beep(kind) {
  try { if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 40 : [80, 60, 80]); } catch (e) {}
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = kind === 'ok' ? 880 : 220; o.type = 'sine';
    g.gain.value = .08; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (kind === 'ok' ? .08 : .25));
  } catch (e) {}
}

// ---------- hivasok, kapcsolat nelkuli sor ----------
let Q = []; try { Q = JSON.parse(ls.get('rk_q') || '[]'); } catch (e) {}
const saveQ = () => ls.set('rk_q', JSON.stringify(Q));
const isNet = e => /fetch|network|load failed|timeout/i.test(String(e && e.message || e));
async function send(fn, args) {
  try {
    const {data, error} = await sb.rpc(fn, args);
    if (error) return isNet(error) ? {net: true} : {err: error.message};
    return {data};
  } catch (e) { return {net: true}; }
}
async function flushQ() {
  while (Q.length) { const r = await send(Q[0].fn, Q[0].args); if (r.net) return false; Q.shift(); saveQ(); }
  return true;
}
// az irasok sorrendje kotott, ezert egy lancban futnak
let chain = Promise.resolve();
function call(fn, args) {
  const p = chain.then(async () => {
    if (Q.length) { Q.push({fn, args}); saveQ(); await flushQ(); renderChrome(); return {queued: true}; }
    const r = await send(fn, args);
    if (r.net) { Q.push({fn, args}); saveQ(); D.online = false; renderChrome(); }
    else if (r.err) toast('Hiba: ' + r.err);
    return r;
  });
  chain = p.catch(() => {});
  return p;
}
function logScan(kind, raw, key, result, carton) {
  call('rk_log_scan', {p_device: device, p_kind: kind, p_raw: raw, p_key: key || '', p_result: result, p_carton: carton || ''});
}
async function setLine(id, done) {
  const l = D.byId.get(id); if (!l) return;
  if (done) D.lineDone.set(id, {line_id: id, done_by: device}); else D.lineDone.delete(id);
  const o = D.open.get(l.carton);
  if (o) { const p = cartonProg(l.carton); if (done && p.done >= p.n) o.status = 'done'; else if (!done && o.status === 'done') o.status = 'open'; }
  logScan('line', l.sku, l.key, done ? 'line_done' : 'line_undone', l.carton);
  animNext = true; update();
  await call('rk_set_line', {p_line: id, p_done: done, p_device: device});
}
async function openCarton(c) {
  if (!D.open.has(c)) D.open.set(c, {carton: c, status: 'open', opened_by: device, opened_at: new Date().toISOString()});
  update();
  await call('rk_open_carton', {p_carton: c, p_device: device});
}
async function setDone(c, done) {
  const o = D.open.get(c); if (o) o.status = done ? 'done' : 'open';
  update();
  await call('rk_set_done', {p_carton: c, p_done: done});
}

// ---------- szkennelt kod ----------
function pushHist(raw, text, result, carton) {
  hist.unshift({t: Date.now(), raw, text, carton: carton || '', result}); hist = hist.slice(0, 12); ls.set('rk_hist', JSON.stringify(hist));
}
async function onScan(raw, replay) {
  raw = raw.trim(); if (!raw) return;
  const c = classify(raw); animNext = true;
  if (c.kind === 'badcarton') {
    last = {t: 'badcarton', raw: c.raw};
    if (!replay) { logScan('carton', c.raw, '', 'unknown', ''); pushHist(c.raw, 'Érvénytelen azonosító', 'bad'); }
    beep('bad'); return update();
  }
  if (c.kind === 'carton') {
    if (!D.byCarton.has(c.carton)) {
      last = {t: 'carton', carton: c.carton, state: 'unknown', raw};
      if (!replay) { logScan('carton', raw, '', 'unknown', c.carton); pushHist(raw, 'Ismeretlen doboz', 'bad', c.carton); }
      beep('bad'); return update();
    }
    const st = cartonStatus(c.carton);
    const state = !st ? 'opened' : st === 'done' ? 'done' : 'already';
    last = {t: 'carton', carton: c.carton, state, raw};
    if (!replay) {
      pushHist(raw, state === 'opened' ? 'Felvéve' : state === 'done' ? 'Kész doboz' : 'Már felvéve', state === 'opened' ? 'ok' : 'warn', c.carton);
      if (state === 'opened') { openCarton(c.carton); } else logScan('carton', raw, '', state, c.carton);
    }
    beep(state === 'done' ? 'bad' : 'ok'); return update();
  }
  if (c.kind === 'cands') { last = {t: 'cands', c, raw}; beep('ok'); return update(); }
  if (c.kind === 'unknown') {
    last = {t: 'unknown', raw}; if (!replay) { logScan('sku', raw, c.key, 'unknown'); pushHist(raw, 'Nincs a goodslistben', 'bad'); }
    beep('bad'); return update();
  }
  const lines = D.byKey.get(c.key);
  const open = lines.filter(l => cartonStatus(l.carton) === 'open' && !isLineDone(l));
  const fin = lines.filter(l => isLineDone(l) || cartonStatus(l.carton) === 'done');
  const res = open.length === 1 ? 'open1' : open.length ? 'openN' : fin.length && lines.some(l => cartonStatus(l.carton) === 'open') ? 'surplus' : 'closed';
  last = {t: 'sku', key: c.key, raw};
  if (!replay) {
    logScan('sku', raw, c.key, res, open[0] && open[0].carton);
    pushHist(raw, lines[0].descr + (open.length > 1 ? ' (' + open.length + ' doboz)' : ''), open.length ? 'ok' : 'warn', open.length === 1 ? open[0].carton : '');
  }
  beep(open.length ? 'ok' : 'bad'); update();
}

// ---------- fejlec, navigacio ----------
const nav = $('#tabs');
const TABS = [['scan', 'Szkennelés', 'scan'], ['ident', 'Azonosítás', 'target'], ['cartons', 'Dobozok', 'box']];
nav.insertAdjacentHTML('beforeend', TABS.map(([k, n, i]) => `<button role="tab" data-v="${k}">${ic(i)}${n}${k === 'cartons' ? '<span class="badge" id="bd" hidden></span>' : ''}</button>`).join(''));
nav.querySelectorAll('button').forEach(b => b.onclick = () => goView(b.dataset.v));
let lastBadge = -1;
function renderChrome() {
  $('#dev').textContent = device || 'Név';
  $('#mut').innerHTML = muted ? ic('mute') : ic('vol');
  $('#mut').setAttribute('aria-pressed', muted);
  $('#sync').setAttribute('aria-label', D.online ? 'Online' : 'Nincs kapcsolat');
  $('#sync').className = 'sync' + (D.online ? '' : ' off');
  $('#sync').innerHTML = (D.online ? ic('wifi') : ic('off') + 'Nincs kapcsolat') + (Q.length ? ` ${Q.length}` : '');
  nav.style.setProperty('--i', ORDER.indexOf(view));
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === view));

  if (!cands.length) {
    const alts = keys.length > 1 ? keys.map(k => ({k, n: identCands(keys.filter(x => x !== k)).length})).filter(a => a.n > 0).sort((a, b) => a.n - b.n).slice(0, 3) : [];
    body = `<section class="hero bad"><div class="hero-top"><span class="hero-ico">${ic('x')}</span>Nincs szabad doboz</div>${cands.hidden ? `<div class="hero-note">${cands.hidden} foglalt</div>` : ''}</section>
      ${alts.length ? `<div class="eyebrow alt-h">Ha kihagyod</div><div class="card">${alts.map((a, i) => `<div class="row-i ${stI(i)}"><div class="rest"><b>${esc(D.byKey.get(a.k)[0].descr)}</b><span class="meta">${a.n} doboz marad</span></div><button class="btn sm" data-rmk="${a.k}">Kihagyom</button></div>`).join('')}</div>` : ''}`;
  } else {
    body = `<div class="eyebrow alt-h" style="margin-top:0">${cands.length} doboz${cands.hidden ? ` · ${cands.hidden} foglalt rejtve` : ''}</div>${cands.slice(0, 10).map((x, i) => candCard(x, i, keys)).join('')}${cands.length > 10 ? `<div class="meta" style="margin:var(--s2)">10 a ${cands.length}-ból. Szkennelj további terméket.</div>` : ''}`;
  }
  return msg + back + body + chips;
}
function updateIdent() {
  if (shellView !== 'ident') {
    shellView = 'ident';
    app.innerHTML = `<form class="scan" id="xf" autocomplete="off"><span class="lead">${ic('target')}</span>
        <input id="xin" enterkeyhint="done" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Termék kódja" placeholder="Szkenneld a terméket"></form>
      <div id="xr" style="margin-top:var(--s3)"></div>`;
    const inp = $('#xin');
    $('#xf').onsubmit = e => { e.preventDefault(); const v = inp.value; inp.value = ''; onIdentScan(v); };
    inp.focus();
    $('#xr').onclick = async e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return; const d = b.dataset;
      if (d.gp) { const l = D.byId.get(+d.gp); WK.hl = l.id; return setGot(l.id, lineGot(l) + 1); }
      if (d.gm) { const l = D.byId.get(+d.gm); WK.hl = l.id; return setGot(l.id, lineGot(l) - 1); }
      if (d.ga) { const l = D.byId.get(+d.ga); WK.hl = l.id; return setGot(l.id, l.qty); }
      if (d.build) return claimBox(d.build);
      if (d.go) { WK.active = d.go; ls.set('rk_active', d.go); WK.view = 'work'; WK.finished = ''; animNext = true; return updateIdent(); }
      if (d.rel) return releaseBox(d.rel);
      if (d.short) return closeShort(d.short);
      if (d.next !== undefined) { WK.finished = ''; WK.view = activeBox() ? 'work' : 'find'; WK.keys = []; animNext = true; return updateIdent(); }
      if (d.back !== undefined) { WK.view = 'work'; WK.keys = []; WK.msg = null; animNext = true; return updateIdent(); }
      if (d.exp) { const c = d.exp, cur = WK.exp[c] !== undefined ? WK.exp[c] : (identCands(WK.keys)[0] || {}).c === c; WK.exp[c] = !cur; return updateIdent(); }
      if (d.rmk) { WK.keys = WK.keys.filter(k => k !== d.rmk); WK.msg = null; animNext = true; return updateIdent(); }
      if (d.iclear !== undefined) { WK.keys = []; WK.msg = null; animNext = true; return updateIdent(); }
    };
    animNext = true;
  }
  const r = $('#xr'); flashAnim(r); setHtml(r, identHtml());
}

// ---------- dobozok nezet ----------
async function addCarton(raw) {
  const c = classify(raw);
  if (c.kind !== 'carton') { cf.msg = {tone: 'bad', html: 'Érvénytelen azonosító'}; logScan('carton', raw, '', 'unknown', ''); beep('bad'); return updateCartons(); }
  if (!D.byCarton.has(c.carton)) { cf.msg = {tone: 'bad', html: idHtml(c.carton) + ' nincs a goodslistben'}; logScan('carton', raw, '', 'unknown', c.carton); beep('bad'); return updateCartons(); }
  const st = cartonStatus(c.carton);
  if (st) { cf.msg = {tone: 'warn', html: idHtml(c.carton) + (st === 'done' ? ' kész' : ' már felvéve')}; logScan('carton', raw, '', st === 'done' ? 'done' : 'already', c.carton); beep('bad'); return updateCartons(); }
  cf.msg = {tone: 'ok', html: idHtml(c.carton) + ' felvéve'};
  beep('ok'); pushHist(raw, 'Felvéve', 'ok', c.carton);
  await openCarton(c.carton);
}
function updateCartons() {
  if (shellView !== 'cartons') {
    shellView = 'cartons';
    app.innerHTML = `<div class="tools">
        <button class="swb" id="sw" role="switch" aria-checked="false"><span class="t">Hiányos doboz hozzáadása</span><span class="track"></span></button>
        <form class="scan sm" id="af" autocomplete="off"><span class="lead">${ic('search')}</span>
          <input id="cq" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Doboz azonosító"><button class="btn pri sm addb" id="addb" type="submit" hidden>Hozzáad</button></form>
        <div id="am" role="status" aria-live="polite"></div></div>
      <div class="seg" id="fl"></div>
      <div class="card" id="cl"></div>`;
    $('#sw').onclick = () => { cf.add = !cf.add; cf.msg = null; cf.q = ''; $('#cq').value = ''; updateCartons(); $('#cq').focus(); };
    $('#af').onsubmit = e => { e.preventDefault(); const v = $('#cq').value; $('#cq').value = ''; if (cf.add && v.trim()) addCarton(v); };
    $('#cq').oninput = e => { if (!cf.add) { cf.q = e.target.value.toUpperCase().replace(/\s/g, ''); fillCartons(); } };
    $('#cl').onclick = e => { const r = e.target.closest('[data-c]'); if (r) showCarton(r.dataset.c); };
    animNext = true;
  }
  const on = cf.add, cq = $('#cq');
  $('#sw').setAttribute('aria-checked', on);
  cq.placeholder = on ? 'RQ-XPW...' : 'Keresés';
  $('#af').classList.toggle('has-btn', on); $('#addb').hidden = !on;
  setHtml($('#am'), on && cf.msg ? `<div class="msg ${cf.msg.tone}">${cf.msg.html}</div>` : '', true);
  const all = [...D.open.values()], cnt = {own: all.filter(x => x.status === 'open' && claimOf(x.carton) === device).length, open: all.filter(x => x.status === 'open').length, done: all.filter(x => x.status === 'done').length, all: all.length};
  setHtml($('#fl'), [['own', 'Saját'], ['open', 'Nyitott'], ['done', 'Kész'], ['all', 'Mind']].map(([k, n]) => `<button class="chip" data-f="${k}" aria-pressed="${cf.st === k}">${n}<span class="n">${cnt[k]}</span></button>`).join(''));
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { cf.st = b.dataset.f; animNext = true; updateCartons(); });
  fillCartons();
}
function fillCartons() {
  const q = cf.add ? '' : cf.q, el = $('#cl'); flashAnim(el);
  const rows = [...D.open.values()].filter(r => (cf.st === 'all' || (cf.st === 'own' ? r.status === 'open' && claimOf(r.carton) === device : r.status === cf.st)) && (!q || r.carton.includes(q)))
    .sort((a, b) => cartonProg(b.carton).ratio - cartonProg(a.carton).ratio || a.carton.localeCompare(b.carton));
  setHtml(el, rows.length ? rows.map((r, i) => {
    const p = cartonProg(r.carton), dn = r.status === 'done';
    return `<div class="crow ${stI(i)}" data-c="${esc(r.carton)}">${ring(p.ratio, 34, p.done + '/' + p.n)}${idHtml(r.carton)}${claimOf(r.carton) ? `<span class="tag ${claimOf(r.carton) === device ? '' : 'mute'}">${claimOf(r.carton) === device ? 'saját' : esc(claimOf(r.carton))}</span>` : ''}<span class="frac ${dn ? 'ok' : ''}">${dn ? ic('check').replace('class="i"', 'class="i sm"') : p.done + '/' + p.n}</span></div>`;
  }).join('') : `<div class="empty"><b>${q ? 'Nincs találat' : 'Nincs doboz'}</b></div>`);
}
function showCarton(c) {
  const o = D.open.get(c); if (!o) return;
  const p = cartonProg(c);
  const d = dialog(`<div style="margin-bottom:var(--s3);display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap"><span style="font-size:20px">${idHtml(c)}</span><span class="tag ${o.status === 'done' ? 'ok' : ''}">${o.status === 'done' ? 'kész' : p.done + '/' + p.n}</span></div>
    <div class="card">${cartonLines(c)}</div>
    <div class="row"><button class="btn" id="cx">Bezár</button>
      ${o.status === 'done' ? '<button class="btn" id="cr">Újranyitás</button>' : '<button class="btn pri" id="cd">Doboz kész</button>'}</div>`);
  d.querySelectorAll('[data-line]').forEach(b => b.onclick = async () => { await setLine(+b.dataset.line, b.dataset.v === '1'); if (D.open.has(c)) showCarton(c); });
  d.querySelector('#cx').onclick = () => d.close();
  const cr = d.querySelector('#cr'), cd = d.querySelector('#cd');
  if (cr) cr.onclick = async () => { await setDone(c, false); showCarton(c); };
  if (cd) cd.onclick = async () => { d.close(); await setDone(c, true); toast('Kész'); };
}

// ---------- eszkoz ----------
function askDevice(first) {
  const d = dialog(`<h2>${first ? 'Eszköz neve' : 'Név'}</h2>
    <label class="field"><input id="dn" value="${esc(device || 'PDA-1')}" maxlength="20" aria-label="Eszköz neve"></label>
    <div class="row"><button class="btn pri" id="ok">Mentés</button></div>`);
  d.oncancel = e => { if (!device) e.preventDefault(); };
  const go = () => { const v = d.querySelector('#dn').value.trim(); if (!v) return; device = v; ls.set('rk_device', v); d.close(); update(); };
  d.querySelector('#ok').onclick = go;
  d.querySelector('#dn').onkeydown = e => { if (e.key === 'Enter') go(); };
  d.querySelector('#dn').select();
}
$('#dev').onclick = () => askDevice(false);
$('#mut').onclick = () => { muted = !muted; ls.set('rk_mute', muted ? '1' : '0'); renderChrome(); };

// ---------- inditas ----------
async function tick(full) {
  await chain;
  await flushQ();
  await refreshData(full);
  loading = false; update();
}
window.addEventListener('online', () => tick(false));
window.addEventListener('offline', () => { D.online = false; renderChrome(); });
if (!device) askDevice(true);
if (loadCache()) loading = false;
update();
tick(true);
setInterval(() => tick(false), 8000);
watch(() => update());
</script>
</body>
