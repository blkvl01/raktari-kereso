<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2342d6">
<title>Raktári kereső</title>
<link rel="stylesheet" href="common.css?v=30">
<style>
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));overflow-x:hidden}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;padding:6px var(--s3);padding-top:calc(6px + env(safe-area-inset-top))}
.brand{flex:1;display:flex;align-items:center}
.logo{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;transition:transform .5s var(--spring)}
.logo:active{transform:rotate(-12deg) scale(.92)}
.top .chip{min-height:34px;padding:0 10px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-small);color:var(--mute);transition:color .3s}
.sync.off{color:var(--bad);font-weight:700}
main{max-width:720px;margin:0 auto;padding:var(--s3)}
#app{min-height:60vh}
#app[data-enter=R]{animation:slideInR .42s var(--ease-out)}
#app[data-enter=L]{animation:slideInL .42s var(--ease-out)}
#app[data-leave=L]{animation:outL .12s ease-in forwards}
#app[data-leave=R]{animation:outR .12s ease-in forwards}

.scan{position:relative}
.scan input{width:100%;font-size:21px;padding:13px 16px 13px 48px;border:2px solid var(--accent);border-radius:var(--r);background:var(--surface);letter-spacing:.3px;box-shadow:var(--sh);text-transform:uppercase;transition:box-shadow .25s,border-color .25s}
.scan input:focus{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent),var(--sh);outline:none}
.scan input::placeholder{color:var(--mute);letter-spacing:0;text-transform:none;font-size:17px}
.scan .lead{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--accent);pointer-events:none}
.scan.has-btn input{padding-right:116px}
.scan .addb{position:absolute;right:7px;top:7px;bottom:7px;min-height:0;padding:0 14px;animation:springIn .35s var(--ease-out)}
.scan.sm input{padding-top:10px;padding-bottom:10px;font-size:18px}

#res{margin-top:var(--s3)}
.hero{border-radius:var(--r);padding:var(--s4);color:var(--hero-ink);background:var(--hero-bg) radial-gradient(120% 90% at 100% 0%,rgb(255 255 255 / .2),transparent 60%);box-shadow:var(--sh)}
.anim .hero{animation:springIn .5s var(--ease-out)}
.hero.ok{--hero-bg:var(--ok-strong);--hero-ink:var(--ok-strong-ink)}
.hero.warn{--hero-bg:var(--warn-strong);--hero-ink:var(--warn-strong-ink)}
.hero.bad{--hero-bg:var(--bad-strong);--hero-ink:var(--bad-strong-ink)}
.hero.info{--hero-bg:var(--accent);--hero-ink:var(--accent-ink)}
.hero-top{display:flex;align-items:center;gap:var(--s2);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.hero-ico{width:30px;height:30px;border-radius:50%;background:rgb(255 255 255 / .22);display:grid;place-items:center}
.anim .hero-ico{animation:ripple .9s .15s}
.anim .hero-ico svg path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s .2s var(--ease-out) forwards}
.hero-top .aux{margin-left:auto;opacity:.9;letter-spacing:0;text-transform:none;font-weight:700}
.hero .idc{margin:var(--s3) 0 var(--s1)}
.hero .idc .idp{color:inherit;opacity:.85;font-size:clamp(19px,6.2vw,28px);font-weight:700}
.hero .idc .id4{margin:0;padding:0 14px;background:rgb(255 255 255 / .22);color:inherit;font-size:clamp(58px,20vw,92px);line-height:1.12;letter-spacing:.04em}
.anim .hero .idc .id4{animation:flashId .9s var(--ease-out)}
.hero.compact{padding:var(--s3) var(--s4)}
.hero.compact .idc{margin:var(--s2) 0 0}
.hero.compact .idc .idp{font-size:15px}
.hero.compact .idc .id4{font-size:clamp(36px,11vw,48px);padding:0 10px}
.hero.compact .pbar{margin-top:var(--s2)}
.hero.compact .hchips{margin-top:var(--s2)}
.hero-prod{margin-top:var(--s3);font-size:18px;font-weight:700;line-height:1.25}
.hero-sub{margin-top:2px;font-size:13px;opacity:.85}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s3)}
.hchip{background:rgb(255 255 255 / .2);padding:4px 11px;border-radius:999px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.hero-btn{margin-top:var(--s4);width:100%;min-height:58px;font-size:17px;border-radius:12px;border:0;background:var(--hero-ink);color:var(--hero-bg);font-weight:800;cursor:pointer}
.hero-btn:hover{filter:brightness(.95)}
.hero-btn.alt{background:rgb(255 255 255 / .2);color:var(--hero-ink)}
.hero-note{margin-top:var(--s2);font-size:14px;opacity:.92}
.alt-h{margin:var(--s4) var(--s1) var(--s2)}
.row-i{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-2)}
.row-i:last-child{border-bottom:0}
.row-i .rest{flex:1;min-width:0;display:grid;gap:4px;justify-items:start}
.row-i .idc{font-size:19px}
.row-i.dim{opacity:.6}
.row-i.best,.lrow.best{background:var(--accent-soft)}

.idle{display:grid;justify-items:center;text-align:center;gap:var(--s2);padding:var(--s6) var(--s4)}
.idle .frame{width:128px;height:128px;border-radius:30px;border:2px dashed var(--accent-line);display:grid;place-items:center;color:var(--accent);position:relative;overflow:hidden;background:var(--accent-soft);margin-bottom:var(--s3);animation:springIn .55s var(--ease-out)}
.idle .frame.scanning::after{content:"";position:absolute;left:12px;right:12px;height:3px;border-radius:2px;background:var(--accent);animation:scanline 2.2s ease-in-out infinite}
@keyframes scanline{0%,100%{top:18%}50%{top:78%}}
.idle h2{margin:0;font-size:22px;letter-spacing:-.01em;animation:rise .5s .08s var(--ease-out) both}
.idle p{margin:0;color:var(--mute);animation:rise .5s .14s var(--ease-out) both}
.idle .btn{margin-top:var(--s3);animation:rise .5s .2s var(--ease-out) both}

.ver{text-align:center;color:var(--mute);font-size:11px;margin:var(--s5) 0 var(--s2);opacity:.7}

.lrow{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;cursor:pointer;min-height:54px;transition:background .15s}
.lrow:hover{background:var(--accent-soft)}
.lrow:active{background:var(--accent-line)}
.lrow .box{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,transform .3s var(--spring)}
.lrow[aria-pressed=true] .box{background:var(--ok-strong);border-color:var(--ok-strong);color:var(--ok-strong-ink);transform:scale(1.08)}
.lrow[aria-pressed=true] .t{opacity:.55}
.lrow .t{flex:1;min-width:0;transition:opacity .2s}
.lrow .t small{display:block;color:var(--mute)}

.msg{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;padding:10px var(--s4);border-radius:var(--r-sm);font-weight:650;animation:springIn .35s var(--ease-out)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.warn{background:var(--warn-soft);color:var(--warn)}.msg.bad{background:var(--bad-soft);color:var(--bad)}
.seg{display:flex;gap:6px;margin:var(--s3) 0 var(--s2)}
.seg .chip{flex:1;justify-content:center;gap:6px;padding:0 8px}
.seg .n{font-variant-numeric:tabular-nums;opacity:.8}
.crow{display:flex;align-items:center;gap:var(--s3);padding:8px var(--s3) 8px var(--s3);border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .15s}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--accent-soft)}
.crow:active{background:var(--accent-line)}
.crow .idc{font-size:17px;flex:1;min-width:0}
.crow .frac{font-weight:800;font-variant-numeric:tabular-nums;color:var(--mute)}
.crow .frac.ok{color:var(--ok)}
.crow .frac{display:inline-flex;align-items:center;gap:4px;min-width:56px;justify-content:flex-end;font-size:13px}

nav.tabs{--i:0;position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
nav.tabs .ind{position:absolute;top:8px;bottom:calc(8px + env(safe-area-inset-bottom));left:12px;width:calc((100% - 24px) / 3);border-radius:var(--r-sm);background:var(--accent);transform:translateX(calc(var(--i) * 100%));transition:transform .5s var(--spring);box-shadow:0 8px 18px -10px var(--accent)}
nav.tabs button{position:relative;z-index:1;min-height:56px;border:0;border-radius:var(--r-sm);background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer;transition:color .3s,transform .18s var(--spring)}
nav.tabs button:active{transform:scale(.93)}
nav.tabs button[aria-selected=true]{color:var(--accent-ink)}
nav.tabs button svg{transition:transform .4s var(--spring)}
nav.tabs button[aria-selected=true] svg{transform:translateY(-1px) scale(1.12)}
.pbar{height:10px;border-radius:5px;background:rgb(255 255 255 / .25);overflow:hidden;margin-top:var(--s3)}
.pbar i{display:block;height:100%;background:var(--hero-ink);border-radius:5px;transition:width .6s var(--ease-out)}
.pl{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-2);flex-wrap:wrap;transition:background .3s,opacity .3s}
.pl:last-child{border-bottom:0}
.pl .pn{flex:1;min-width:150px;display:grid;gap:2px}
.pl.full{opacity:.55}
.pl.hl{animation:lineHl 1.2s var(--ease-out)}
@keyframes lineHl{0%{background:var(--ok-soft);transform:scale(1.015)}100%{background:transparent;transform:none}}
.stp{display:flex;align-items:center;gap:6px}
.stp .btn.xs{min-width:36px;min-height:36px;padding:0 8px}
.stp .qv{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}
.stp .qv b{font-size:20px}
.cdc{margin-bottom:var(--s3)}
.cdc.own{border-color:var(--accent)}
.cdh{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4)}
.cdh .rest{flex:1;min-width:0;display:grid;gap:4px;justify-items:start}
.cdh .idc{font-size:19px}
.cdt{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--line-2);background:var(--surface-2);padding:8px var(--s4);font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
.cdt .chev{transition:transform .35s var(--spring)}
.cdt[aria-expanded=true] .chev{transform:rotate(180deg)}
.needs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease-out)}
.needs.on{grid-template-rows:1fr}
.needs>.ni{overflow:hidden;min-height:0}
.need{display:flex;justify-content:space-between;gap:var(--s3);padding:8px var(--s4);border-top:1px solid var(--line-2);font-size:14px}
.need.is{background:var(--accent-soft);font-weight:700}
.need b{white-space:nowrap}
.need small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad-strong);color:var(--bad-strong-ink);font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.badge.pop{animation:badgePop .45s var(--spring)}
.badge.ok{background:var(--ok-strong);color:var(--ok-strong-ink)}
.hero-acts{display:flex;gap:var(--s2);margin-top:var(--s3)}
.hero-acts .hero-btn{margin:0;flex:1;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);width:100%;max-width:420px;margin-top:var(--s4);animation:rise .5s .2s var(--ease-out) both}
.quick button{display:grid;gap:2px;justify-items:center;padding:var(--s3) var(--s2);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;font-size:12px;font-weight:700;color:var(--mute)}
.quick button b{font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.quick button.hot{border-color:var(--ok-strong);background:var(--ok-soft)}
.quick button.hot b{color:var(--ok)}
.cdc.full{border-color:var(--ok-strong)}
.cdc.full .cdh .idc{font-size:24px}
.pk{display:flex;align-items:center;gap:var(--s3);padding:8px var(--s3) 8px var(--s4);border-bottom:1px solid var(--line-2)}
.pk:last-child{border-bottom:0}
.pk .t{flex:1;min-width:0}
.pk .t small{display:block;color:var(--mute)}
.pk .n{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar2{display:flex;gap:var(--s2);margin-bottom:var(--s3)}
/* darabszam: +/- gombok vagy kezi beiras (nincs gyors gomb) */
.qty{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3)}
.qty .btn{flex:none;width:60px;min-height:60px;padding:0;font-size:26px;border-radius:12px;background:var(--surface);color:var(--ink);border-color:transparent}
.qty .btn:hover{background:var(--accent-soft)}
.qty .qi{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;min-height:60px;border-radius:12px;background:var(--surface);color:var(--ink)}
.qty input,.qn{border:0;background:none;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield;appearance:textfield}
.qty input{width:64px;font-size:32px}
.qty small{color:var(--mute);font-size:17px;font-weight:700}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button,.qn::-webkit-outer-spin-button,.qn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp .qv{display:flex;align-items:baseline;gap:1px;min-width:0}
.qn{width:46px;font-size:20px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
.pl{flex-wrap:nowrap;gap:var(--s2)}
.pl .pn{min-width:0}
.pl .stp .btn.xs{min-width:40px;min-height:40px}
.hero-form .hero-btn{margin-top:var(--s3)}
/* doboz valaszto (tobb nyitott doboz): a hero stilusoktol fuggetlen, jol olvashato */
.pick{display:grid;gap:6px;margin-top:var(--s3)}
.pick button{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);width:100%;min-height:54px;padding:6px 12px;border:3px solid transparent;border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.pick button.on{border-color:var(--ink)}
.pick b{font-size:15px;white-space:nowrap}
.hero .pick .idc{margin:0;font-size:14px;flex-wrap:nowrap}
.hero .pick .idc .idp{font-size:13px;color:var(--mute);opacity:1;font-weight:600}
.hero .pick .idc .id4{margin:0 0 0 2px;padding:0 8px;background:var(--accent);color:var(--accent-ink);font-size:22px;line-height:1.35;animation:none}
.hero-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.hero-acts .hero-btn{min-width:0;padding:0 8px;font-size:15px;gap:6px;white-space:nowrap}
/* listak: egy-ket soros kompakt sorok */
.crow .cm{flex:1;min-width:0;display:grid;gap:6px}
.crow .cl1{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.crow .cl1 .idc{flex:0 1 auto;font-size:14px;flex-wrap:nowrap}
.crow .cl2{display:flex;align-items:center;gap:var(--s2)}
.crow .cl2 .bar{flex:1}
.row-i .idc{font-size:15px;flex-wrap:nowrap}
.cdc:not(.full) .cdh .idc{font-size:15px;flex-wrap:nowrap}
.bar2 .btn{flex:1}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg></span></div>
  <span class="sync" id="sync" role="status" aria-live="polite"></span>
  <button class="chip" id="dev" aria-label="Eszköz neve"></button>
  <button class="chip" id="mut" aria-label="Hang be/ki"></button>
</header>
<main><div id="app"></div></main>
<nav class="tabs" id="tabs" role="tablist" aria-label="Nézetek"><span class="ind"></span></nav>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="common.js?v=28"></script>
<script>
// Folyamat: a kalodabol kivett termeket a Valogatas fulon szkenneled.
//  - ha egy nyitott dobozba kell: megmutatjuk a dobozt, a dolgozo megadja hany darabot tesz bele, csak ezutan szamolodik be
//  - ha egyikbe sem: a dolgozo dont (Felreteszem / Uj doboz). Csak a gombnyomas tesz a kozos polcra,
//    a "Nincs sehova" semmit nem ment. Dontes nelkul nem lehet uj kodot szkennelni.
const ORDER = ['sort', 'park', 'cartons'];
let view = ORDER.includes(ls.get('rk_view')) ? ls.get('rk_view') : 'sort';
let device = ls.get('rk_device') || '';
let muted = ls.get('rk_mute') === '1';
let loading = true, animNext = false, shellView = '', HL = 0;
let SV = {res: null};                                            // valogatas: utolso szkenneles eredmenye
let PV = {msg: null, exp: {}};                                   // felretett polc
let cf = {st: 'open', q: '', box: '', ident: false, keys: [], msg: null};   // dobozok
const app = $('#app');

// ---------- visszajelzes ----------
let actx;
function beep(kind) {
  try { if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 40 : kind === 'park' ? [40, 60, 40] : [80, 60, 80]); } catch (e) {}
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const tones = kind === 'ok' ? [[880, 0, .08]] : kind === 'park' ? [[520, 0, .07], [520, .12, .07]] : [[220, 0, .25]];
    tones.forEach(([f, at, len]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; o.type = 'sine'; g.gain.value = .08; o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + at); o.stop(actx.currentTime + at + len);
    });
  } catch (e) {}
}

// ---------- hivasok, kapcsolat nelkuli sor ----------
let Q = []; try { Q = JSON.parse(ls.get('rk_q') || '[]'); } catch (e) {}
const saveQ = () => ls.set('rk_q', JSON.stringify(Q));
const isNet = e => /fetch|network|load failed|timeout/i.test(String(e && e.message || e));
async function send(fn, args) {
  try {
    const {data, error} = await sb.rpc(fn, args);
    if (error) return isNet(error) ? {net: true} : {err: error.message};
    return {data};
  } catch (e) { return {net: true}; }
}
async function flushQ() {
  while (Q.length) { const r = await send(Q[0].fn, Q[0].args); if (r.net) return false; Q.shift(); saveQ(); }
  return true;
}
// az irasok sorrendje kotott, ezert egy lancban futnak
let chain = Promise.resolve();
function call(fn, args) {
  const p = chain.then(async () => {
    if (Q.length) { Q.push({fn, args}); saveQ(); await flushQ(); renderChrome(); return {queued: true}; }
    const r = await send(fn, args);
    if (r.net) { Q.push({fn, args}); saveQ(); D.online = false; renderChrome(); }
    else if (r.err) toast('Hiba: ' + r.err);
    return r;
  });
  chain = p.catch(() => {});
  return p;
}
function logScan(kind, raw, key, result, carton) {
  call('rk_log_scan', {p_device: device, p_kind: kind, p_raw: raw, p_key: key || '', p_result: result, p_carton: carton || ''});
}
async function openCarton(c) {
  if (!D.open.has(c)) D.open.set(c, {carton: c, status: 'open', opened_by: device, opened_at: new Date().toISOString()});
  update();
  await call('rk_open_carton', {p_carton: c, p_device: device});
}
async function setDone(c, done) {
  const o = D.open.get(c); if (o) o.status = done ? 'done' : 'open';
  update();
  await call('rk_set_done', {p_carton: c, p_done: done});
}
async function setGot(id, n) {
  const l = D.byId.get(id); if (!l) return;
  n = Math.max(0, Math.min(l.qty, n));
  const before = lineGot(l);
  if (n !== before) logScan('line', `${id}:${before}>${n}`, l.key, 'qty', l.carton);
  D.lineDone.set(id, {line_id: id, got: n, done_by: device});
  const o = D.open.get(l.carton), p = cartonProg(l.carton);
  if (o) { if (p.done >= p.n) o.status = 'done'; else if (o.status === 'done') o.status = 'open'; }
  animNext = true; update();
  await call('rk_set_got', {p_line: id, p_got: n, p_device: device});
}
async function unopen(c) {
  const o = D.open.get(c);
  if (o && o.opened_by !== device) return toast('Csak a felvevő eszköz vonhatja vissza');
  D.open.delete(c); (D.byCarton.get(c) || []).forEach(l => D.lineDone.delete(l.id));
  if (SV.res && SV.res.c === c) SV.res = null;
  animNext = true; update();
  await call('rk_unopen', {p_carton: c, p_device: device}); toast('Visszavonva');
}
async function closeShort(c) {
  if (!await confirmDlg('Lezárod a dobozt hiánnyal?', 'Lezárás', false)) return;
  for (const l of D.byCarton.get(c) || []) if (!D.lineDone.has(l.id)) { D.lineDone.set(l.id, {line_id: l.id, got: 0, done_by: device}); call('rk_set_got', {p_line: l.id, p_got: 0, p_device: device}); }
  const o = D.open.get(c); if (o) o.status = 'done';
  animNext = true; update(); toast('Lezárva');
  await call('rk_set_done', {p_carton: c, p_done: true});
}
// felretett polc: +1 felretesz, -n levesz
function park(key, delta) {
  const n = Math.max(0, (D.parked.get(key) || 0) + delta);
  if (n) D.parked.set(key, n); else D.parked.delete(key);
  if (D.parkShared) call('rk_park', {p_key: key, p_delta: delta, p_device: device});
  else ls.set('rk_parked_local', JSON.stringify([...D.parked]));
}
// doboz nyitasa a polcrol: ami a polcon van belole, atkerul; ha minden megvolt, a doboz kesz
async function pullFromPark(c) {
  const moved = [];
  for (const l of D.byCarton.get(c) || []) {
    const k = Math.min(D.parked.get(l.key) || 0, l.qty - lineGot(l));
    if (k > 0) { park(l.key, -k); moved.push(l.descr + (k > 1 ? ' ×' + k : '')); await setGot(l.id, lineGot(l) + k); }
  }
  return moved;
}
async function fromPark(c) {
  if (!cartonStatus(c)) await openCarton(c);
  await pullFromPark(c);
  const done = cartonProg(c).done >= cartonProg(c).n;
  logScan('park', c, '', done ? 'built' : 'opened', c);
  if (done) { const o = D.open.get(c); if (o) o.status = 'done'; call('rk_set_done', {p_carton: c, p_done: true}); }
  PV.msg = {tone: 'ok', html: idHtml(c) + (done ? ' kész, lezárható. Címke: admin felület.' : ' megnyitva, tedd a helyére.')};
  animNext = true; update();
}

// ---------- utvonal: termek -> doboz ----------
// nyitott dobozok, amelyekbe ez a termek meg kell; elol ami hamarabb kesz lesz
function putTargets(key) {
  const seen = new Set();
  return (D.byKey.get(key) || []).filter(l => cartonStatus(l.carton) === 'open' && lineGot(l) < l.qty)
    .map(l => ({l, c: l.carton, rem: remPieces(l.carton)}))
    .sort((a, b) => a.rem - b.rem || a.c.localeCompare(b.c))
    .filter(x => !seen.has(x.c) && seen.add(x.c));
}
// ennyi darab kellhet meg ebbol a meg nem nyitott dobozokba
const freeNeed = key => (D.byKey.get(key) || []).filter(l => !cartonStatus(l.carton)).reduce((a, l) => a + l.qty - lineGot(l), 0);
const fullBoxes = () => collected().filter(x => x.full);
const openCount = () => [...D.open.values()].filter(x => x.status === 'open').length;

// ---------- valogatas: szkennelt kod ----------
// a nyitott doboz nelkuli termeknel a dolgozo dont: felreteszi vagy uj dobozt nyit.
function askPark(r) {
  park(r.key, 1); logScan('sku', r.raw, r.key, 'aside'); beep('park');
}
async function newBox(c, r) {
  const l = (D.byCarton.get(c) || []).find(x => x.key === r.key && lineGot(x) < x.qty); if (!l) return;
  await openCarton(c);
  logScan('sku', r.raw, r.key, 'newbox', c); beep('ok');
  await setGot(l.id, lineGot(l) + 1);
  const pulled = await pullFromPark(c);
  if (cartonProg(c).done >= cartonProg(c).n) { const o = D.open.get(c); if (o) o.status = 'done'; call('rk_set_done', {p_carton: c, p_done: true}); }
  SV.res = {t: 'put', id: l.id, pulled}; animNext = true; update();
}
// nyitott dobozba kerules: a dolgozo megadja a darabszamot, csak ekkor szamolodik be
async function confirmPut(r, n) {
  const l = D.byId.get(r.sel); if (!l) return;
  const rem = l.qty - lineGot(l); if (rem < 1) return;
  n = Math.max(1, Math.min(Math.floor(n) || 1, rem));
  const t = putTargets(r.key);
  SV.res = {t: 'put', id: l.id, n}; HL = l.id;
  logScan('sku', r.raw, r.key, t.length > 1 ? 'openN' : 'open1', l.carton); beep('ok');
  return setGot(l.id, lineGot(l) + n);
}
async function onScan(raw) {
  raw = raw.trim(); if (!raw) return;
  if (SV.res && ['pend', 'ask', 'new'].includes(SV.res.t)) { toast('Előbb döntsd el, mi legyen a termékkel'); beep('bad'); return; }
  const c = classify(raw); animNext = true; HL = 0; window.scrollTo(0, 0);
  if (c.kind === 'badcarton') { SV.res = {t: 'err', title: 'Érvénytelen azonosító', raw: c.raw, note: 'RQ-XPW + 10 számjegy'}; logScan('carton', c.raw, '', 'unknown', ''); beep('bad'); return update(); }
  if (c.kind === 'carton') return scanCarton(c.carton, raw);
  if (c.kind === 'cands') { SV.res = {t: 'cands', skus: c.skus}; beep('ok'); return update(); }
  if (c.kind === 'unknown') { SV.res = {t: 'err', title: 'Nincs a goodslistben', raw}; logScan('sku', raw, c.key, 'unknown'); beep('bad'); return update(); }
  const key = c.key, t = putTargets(key);
  if (t.length) { SV.res = {t: 'pend', key, raw, sel: t[0].l.id, n: 1}; beep('park'); return update(); }
  if ((D.parked.get(key) || 0) >= freeNeed(key)) { SV.res = {t: 'surplus', key}; logScan('sku', raw, key, 'surplus'); beep('bad'); return update(); }
  SV.res = {t: 'ask', key, raw}; beep('park'); update();
}
function scanCarton(c, raw) {
  if (!D.byCarton.has(c)) { SV.res = {t: 'err', title: 'Ismeretlen doboz', raw: c}; logScan('carton', raw, '', 'unknown', c); beep('bad'); return update(); }
  const st = cartonStatus(c), state = !st ? 'opened' : st === 'done' ? 'done' : 'already';
  SV.res = {t: 'box', c, state};
  beep(state === 'done' ? 'bad' : 'ok');
  if (state === 'opened') openCarton(c); else { logScan('carton', raw, '', state, c); update(); }
}

// doboz gombjai; true ha kezelte
async function boxAct(d) {
  if (d.gp) { const l = D.byId.get(+d.gp); HL = l.id; await setGot(l.id, lineGot(l) + 1); return true; }
  if (d.gm) { const l = D.byId.get(+d.gm); HL = l.id; await setGot(l.id, lineGot(l) - 1); return true; }
  if (d.bopen) { await openCarton(d.bopen); toast('Felvéve'); return true; }
  if (d.unopen) { await unopen(d.unopen); return true; }
  if (d.close) { await closeShort(d.close); return true; }
  if (d.reopen) { await setDone(d.reopen, false); toast('Újranyitva'); return true; }
  return false;
}

    shellView = 'sort';
    app.innerHTML = `<form class="scan" id="sf" autocomplete="off"><span class="lead">${ic('scan')}</span>
        <input id="scan" enterkeyhint="done" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Kód" placeholder="Termék vagy doboz kódja"></form>
      <div id="res"></div><div class="ver">v2.16</div>`;
    const inp = $('#scan');
    $('#sf').onsubmit = e => { e.preventDefault(); const v = inp.value; inp.value = ''; onScan(v); };
    inp.focus();
    $('#res').onsubmit = e => { if (e.target.id !== 'pnf') return; e.preventDefault(); const r = SV.res; if (r && r.t === 'pend') confirmPut(r, +$('#pn').value); };
    $('#res').oninput = e => { const r = SV.res; if (e.target.id === 'pn' && r && r.t === 'pend') r.n = Math.floor(+e.target.value) || 1; };
    $('#res').onchange = onNumSet;
    $('#res').onclick = async e => { if (e.target.closest('input')) return; await onSortClick(e); if (view === 'sort' && !$('#dlg').open && $('#scan')) $('#scan').focus({preventScroll: true}); };
    animNext = true;
  }
  const res = $('#res'); flashAnim(res);
  setHtml(res, resultHtml());
  $('#scan').disabled = !D.lines.length;
}
// tetel darabszamanak kezi beirasa (a doboz tartalmaban)
function onNumSet(e) {
  const i = e.target.closest && e.target.closest('[data-gset]'); if (!i) return;
  const l = D.byId.get(+i.dataset.gset); if (!l) return;
  HL = l.id; setGot(l.id, Math.floor(+i.value) || 0);
}
async function onSortClick(e) {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset, r = SV.res;
  if (await boxAct(d)) return;
  if (d.undo !== undefined && r && r.t === 'put') { const l = D.byId.get(r.id); SV.res = null; toast('Visszavonva'); return setGot(l.id, lineGot(l) - (r.n || 1)); }
  if (d.sel && r && r.t === 'pend') { r.sel = +d.sel; animNext = false; return update(); }
  if ((d.qm !== undefined || d.qp !== undefined) && r && r.t === 'pend') {
    const l = D.byId.get(r.sel), rem = l ? l.qty - lineGot(l) : 1;
    r.n = Math.max(1, Math.min(rem, Math.floor(+($('#pn') || {}).value || r.n || 1) + (d.qp !== undefined ? 1 : -1))); animNext = false; return update();
  }
  if (d.nowhere !== undefined && r && ['pend', 'ask', 'new'].includes(r.t)) { logScan('sku', r.raw, r.key, 'lookup'); SV.res = null; animNext = true; toast('Nem mentve'); return update(); }
  if (d.unpark) { park(d.unpark, -1); SV.res = null; animNext = true; toast('Visszavonva'); return update(); }
  if (d.askpark !== undefined && r && ['pend', 'ask', 'new'].includes(r.t)) { askPark(r); SV.res = {t: 'park', key: r.key}; animNext = true; return update(); }
  if (d.asknew !== undefined && r && r.t === 'ask') { SV.res = {t: 'new', key: r.key, raw: r.raw}; animNext = true; return update(); }
  if (d.newbox && r && r.t === 'new') { SV.res = null; return newBox(d.newbox, r); }
  if (d.move && r && r.t === 'put') {
    const from = D.byId.get(r.id), to = D.byId.get(+d.move), m = Math.max(1, Math.min(r.n || 1, to.qty - lineGot(to))); SV.res = {t: 'put', id: to.id, n: m}; HL = to.id;
    logScan('sku', to.key, to.key, 'move', to.carton);
    await setGot(from.id, lineGot(from) - (r.n || 1)); return setGot(to.id, lineGot(to) + m);
  }
  if (d.showbox) { SV.res = {t: 'box', c: d.showbox, state: 'show'}; animNext = true; return update(); }
  if (d.pick) return onScan(d.pick);
  if (d.goto) return goView(d.goto);
}

// ---------- felretett polc nezet ----------
function boxCard(x, i, full) {
  const open = PV.exp[x.c] !== undefined ? PV.exp[x.c] : i === 0;
  const rows = full
    ? D.byCarton.get(x.c).map(l => `<div class="need"><span>${esc(l.descr)}<small class="mono">${esc(l.sku.split('-')[0])}</small></span><b>${l.qty - lineGot(l)} db</b></div>`).join('')
    : x.miss.map(m => `<div class="need"><span>${esc(keyName(m.k))}<small class="mono">${esc(m.k)}</small></span><b>${m.n} db</b></div>`).join('');
  return `<div class="card cdc ${full ? 'full' : ''} ${stI(i)}"><div class="cdh"><div class="rest">${idHtml(x.c, 0, !full)}<span class="meta">${full ? `${x.total} db · ${D.byCarton.get(x.c).length} tétel` : `${awbChip(cartonAwb(x.c))} ${x.have}/${x.total} db`}</span></div>
      ${full ? '' : `<button class="btn sm" data-build="${esc(x.c)}" data-full="0">Megnyitom</button>`}</div>
    <button class="cdt" data-exp="${esc(x.c)}" data-i="${i}" aria-expanded="${open}">${full ? 'Ezeket vedd le a polcról' : 'Ezek hiányoznak még'}<span class="chev">${icS('chev')}</span></button>
    <div class="needs ${open ? 'on' : ''}"><div class="ni">${rows}</div></div>
    ${full ? `<div class="pad" style="padding:var(--s3) var(--s4)"><button class="btn pri block" data-build="${esc(x.c)}" data-full="1">${ic('check')}Összeraktam</button></div>` : ''}</div>`;
}
// kezi polcra tetel (ami mar fizikailag felre van teve): ha nyitott doboz varja vagy felesleg, eloszor szol
function addToShelf(raw, force) {
  raw = raw.trim(); if (!raw) return;
  const c = classify(raw); animNext = true;
  if (c.kind !== 'sku') { PV.msg = {tone: 'bad', html: c.kind === 'cands' ? 'Írd be a teljes termékkódot.' : c.kind === 'carton' || c.kind === 'badcarton' ? 'Ez doboz azonosító, termék kódot szkennelj.' : 'Nincs a goodslistben: ' + esc(raw)}; beep('bad'); return updatePark(); }
  const key = c.key, t = putTargets(key)[0];
  if (!force && t) { PV.msg = {tone: 'warn', html: `<b>${esc(keyName(key))}</b>: van nyitott doboza, tedd inkább oda: ${idHtml(t.c)} <button class="btn xs" data-force="${key}">Mégis polcra</button>`}; beep('bad'); return updatePark(); }
  if ((D.parked.get(key) || 0) >= freeNeed(key)) { PV.msg = {tone: 'bad', html: `<b>${esc(keyName(key))}</b>: felesleg, egyik nyitatlan dobozba sem kell több.`}; beep('bad'); return updatePark(); }
  park(key, 1); logScan('sku', raw, key, 'aside'); beep('park');
  const full = collected().find(x => x.full && D.byCarton.get(x.c).some(l => l.key === key));
  PV.msg = {tone: 'ok', html: `Polcra téve: <b>${esc(keyName(key))}</b> (${D.parked.get(key)} db)` + (full ? ` · összegyűlt: ${idHtml(full.c)}` : '')};
  updatePark();
}
function parkHtml() {
  const msg = PV.msg ? `<div class="msg ${PV.msg.tone}" role="status" style="margin-bottom:var(--s3)">${PV.msg.html}</div>` : '';
  const items = [...D.parked].filter(([k]) => D.byKey.has(k)).sort((a, b) => keyName(a[0]).localeCompare(keyName(b[0]), 'hu'));
  const local = D.parkShared ? '' : '<div class="msg warn" style="margin-bottom:var(--s3)">A polc csak ezen az eszközön látszik (admin: SQL frissítés kell).</div>';
  if (!items.length) return msg + local + `<div class="idle"><div class="frame">${ic('layers').replace('class="i"', 'class="i lg"')}</div><h2>Üres a polc</h2></div>`;
  const cs = collected(), full = cs.filter(x => x.full), near = cs.filter(x => !x.full).slice(0, 3);
  const total = items.reduce((a, x) => a + x[1], 0);
  return msg + local
    + (full.length ? `<div class="eyebrow alt-h" style="margin-top:0">Összegyűlt, ez a következő doboz (${full.length})</div>${full.slice(0, 5).map((x, i) => boxCard(x, i, true)).join('')}`
      : `<div class="msg warn" style="margin-bottom:var(--s2)">Még nincs összegyűlt doboz</div>`)
    + (near.length ? `<div class="eyebrow alt-h">Legközelebb áll</div>${near.map((x, i) => boxCard(x, full.length ? i + 1 : i, false)).join('')}` : '')
    + `<div class="eyebrow alt-h">A polcon (${total} db, ${items.length} termék)</div><div class="card">${items.map(([k, n], i) => `<div class="pk ${stI(i)}"><div class="t"><b>${esc(keyName(k))}</b><small class="mono">${esc(k)}</small></div><span class="n">${n} db</span><button class="btn xs" data-unpark="${k}" aria-label="Levesz egyet">${ic('minus')}</button><button class="btn xs" data-addk="${k}" aria-label="Még egy">${ic('plus')}</button></div>`).join('')}</div>`;
}
function updatePark() {
  if (shellView !== 'park') {
    shellView = 'park';
    app.innerHTML = `<form class="scan sm" id="pf" autocomplete="off"><span class="lead">${ic('plus')}</span>
        <input id="pin" enterkeyhint="done" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Termék polcra tétele" placeholder="Termék polcra tétele"></form>
      <div id="pr" style="margin-top:var(--s3)"></div>`;
    $('#pf').onsubmit = e => { e.preventDefault(); const v = $('#pin').value; $('#pin').value = ''; addToShelf(v); };
    $('#pr').onclick = async e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return; const d = b.dataset;
      if (d.build) {
        if (d.full !== '1') { const x = collected().find(y => y.c === d.build); if (!await confirmDlg(`Megnyitod? Még ${x ? x.total - x.have : '?'} db hiányzik.`, 'Megnyitom', false)) return; }
        return fromPark(d.build);
      }
      if (d.exp) { const c = d.exp, cur = PV.exp[c] !== undefined ? PV.exp[c] : d.i === '0'; PV.exp[c] = !cur; return updatePark(); }
      if (d.unpark) { park(d.unpark, -1); PV.msg = null; return update(); }
      if (d.addk) return addToShelf(d.addk, true);
      if (d.force) return addToShelf(d.force, true);
    };
    animNext = true;
  }
  const r = $('#pr'); flashAnim(r); setHtml(r, parkHtml());
}

// ---------- dobozok nezet ----------
// azonositas: nem olvashato cimkeju doboz a benne levo termekekbol
function identCands(keys) {
  let set = null;
  for (const k of keys) { const cs = new Set((D.byKey.get(k) || []).map(l => l.carton)); set = set ? new Set([...set].filter(c => cs.has(c))) : cs; }
  return [...(set || [])].filter(c => cartonStatus(c) !== 'done').sort((a, b) => D.byCarton.get(a).length - D.byCarton.get(b).length || a.localeCompare(b));
}
function onCartonsSubmit(raw) {
  raw = raw.trim(); if (!raw) return;
  const c = classify(raw); animNext = true;
  if (c.kind === 'carton') {
    if (!D.byCarton.has(c.carton)) { cf.msg = {tone: 'bad', html: idHtml(c.carton) + ' nincs a goodslistben'}; beep('bad'); return updateCartons(); }
    cf.box = c.carton; cf.msg = null; cf.q = ''; $('#cq').value = ''; beep('ok'); return updateCartons();
  }
  if (!cf.ident) return;
  if (c.kind !== 'sku') { cf.msg = {tone: 'bad', html: c.kind === 'cands' ? 'Írd be a teljes termékkódot.' : 'Nincs a goodslistben: ' + esc(raw)}; beep('bad'); return updateCartons(); }
  $('#cq').value = '';
  if (cf.keys.includes(c.key)) { cf.msg = {tone: 'warn', html: 'Már hozzáadva.'}; beep('bad'); return updateCartons(); }
  cf.keys.push(c.key); cf.msg = null; cf.box = ''; logScan('ident', raw, c.key, 'ident', ''); beep('ok'); updateCartons();
}
function identHtml() {
  const keys = cf.keys, cands = keys.length ? identCands(keys) : [];
  const head = `<div class="bar2"><button class="btn" data-iexit>${ic('undo')}Kilépés</button>${keys.length ? `<button class="btn" data-iclear>${ic('trash')}Újrakezdés</button>` : ''}</div>`;
  if (!keys.length) return head + `<div class="idle"><div class="frame scanning">${ic('target').replace('class="i"', 'class="i lg" style="width:48px;height:48px"')}</div><h2>Nem olvasható a címke?</h2><p>Szkennelj termékeket a dobozból</p></div>`;
  const chips = `<div class="eyebrow alt-h">Termékek (${keys.length})</div><div class="card">${keys.map((k, i) => `<div class="pk ${stI(i)}"><div class="t"><b>${esc(keyName(k))}</b><small class="mono">${esc(k)}</small></div><button class="btn xs" data-rmk="${k}" aria-label="Törlés">${icS('x')}</button></div>`).join('')}</div>`;
  const list = cands.length ? `<div class="eyebrow alt-h" style="margin-top:0">${cands.length} lehetséges doboz${cands.length > 1 ? ', szkennelj még terméket' : ''}</div><div class="card">${cands.slice(0, 6).map((c, i) => { const st = cartonStatus(c); return `<div class="crow ${stI(i)}" data-c="${esc(c)}">${idHtml(c)}<span class="tag ${st ? '' : 'mute'}">${st ? 'nyitott' : 'nincs nyitva'}</span><span class="frac">${D.byCarton.get(c).length} tétel</span></div>`; }).join('')}</div>`
    : `<section class="hero bad"><div class="hero-top"><span class="hero-ico">${ic('x')}</span>Nincs ilyen doboz</div><div class="hero-note">Törölj egy terméket a listából.</div></section>`;
  return head + list + chips;
}
function cartonsHtml() {
  const msg = cf.msg ? `<div class="msg ${cf.msg.tone}" role="alert" style="margin-bottom:var(--s3)">${cf.msg.html}</div>` : '';
  if (cf.box) return msg + `<button class="btn block" style="margin-bottom:var(--s3)" data-back>${ic('undo')}${cf.ident ? 'Vissza az azonosításhoz' : 'Vissza a listához'}</button>` + boxView(cf.box);
  if (cf.ident) return msg + identHtml();
  const all = [...D.open.values()], cnt = {open: all.filter(x => x.status === 'open').length, done: all.filter(x => x.status === 'done').length, all: all.length};
  const q = cf.q.replace(/\D/g, '');
  // sorrend: utolso 4 szamjegy szerint, ahogy a polcon allnak
  const rows = all.filter(r => (cf.st === 'all' || r.status === cf.st) && (!q || r.carton.replace(/\D/g, '').includes(q)))
    .sort((a, b) => a.carton.slice(-4).localeCompare(b.carton.slice(-4)) || a.carton.localeCompare(b.carton));
  return msg + `<div class="bar2"><button class="btn" data-ident>${ic('target')}Címke nem olvasható</button></div>
    <div class="seg">${[['open', 'Nyitott'], ['done', 'Kész'], ['all', 'Mind']].map(([k, n]) => `<button class="chip" data-f="${k}" aria-pressed="${cf.st === k}">${n}<span class="n">${cnt[k]}</span></button>`).join('')}</div>
    <div class="card">${rows.length ? rows.map((r, i) => { const p = cartonProg(r.carton), dn = r.status === 'done';
      return `<div class="crow ${stI(i)}" data-c="${esc(r.carton)}"><div class="cm"><div class="cl1">${idHtml(r.carton)}<span class="frac">${p.got}/${p.qty}${dn ? ' ' + icS('check') : ''}</span></div>
        <div class="cl2"><div class="bar"><i class="${p.ratio >= .9 ? '' : 'o'}" style="width:${Math.round(p.ratio * 100)}%"></i></div>${pctPill(p.ratio)}</div></div></div>`; }).join('')
      : `<div class="empty"><b>${q ? 'Nincs találat' : 'Nincs doboz'}</b></div>`}</div>`;
}
function updateCartons() {
  if (shellView !== 'cartons') {
    shellView = 'cartons';
    app.innerHTML = `<form class="scan sm" id="af" autocomplete="off"><span class="lead">${ic('search')}</span>
        <input id="cq" enterkeyhint="done" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Keresés"></form>
      <div id="cr" style="margin-top:var(--s3)"></div>`;
    $('#af').onsubmit = e => { e.preventDefault(); onCartonsSubmit($('#cq').value); };
    $('#cq').oninput = e => { if (!cf.ident) { cf.q = e.target.value.toUpperCase(); if (!cf.box) updateCartons(); } };
    $('#cr').onchange = onNumSet;
    $('#cr').onclick = async e => {
      if (e.target.closest('input')) return;
      const r = e.target.closest('[data-c]'); if (r) { cf.box = r.dataset.c; cf.msg = null; animNext = true; window.scrollTo(0, 0); return updateCartons(); }
      const b = e.target.closest('button'); if (!b || b.disabled) return; const d = b.dataset;
      if (await boxAct(d)) return;
      if (d.back !== undefined) { cf.box = ''; cf.msg = null; animNext = true; return updateCartons(); }
      if (d.f) { cf.st = d.f; animNext = true; return updateCartons(); }
      if (d.ident !== undefined) { cf.ident = true; cf.keys = []; cf.msg = null; cf.q = ''; $('#cq').value = ''; animNext = true; updateCartons(); return $('#cq').focus(); }
      if (d.iexit !== undefined) { cf.ident = false; cf.keys = []; cf.msg = null; animNext = true; return updateCartons(); }
      if (d.iclear !== undefined) { cf.keys = []; cf.msg = null; animNext = true; return updateCartons(); }
      if (d.rmk) { cf.keys = cf.keys.filter(k => k !== d.rmk); animNext = true; return updateCartons(); }
    };
    animNext = true;
  }
  $('#cq').placeholder = cf.ident ? 'Szkenneld a terméket' : 'Doboz keresése vagy szkennelése';
  const el = $('#cr'); flashAnim(el); setHtml(el, cartonsHtml());
}

// ---------- eszkoz ----------
function askDevice(first) {
  const d = dialog(`<h2>${first ? 'Eszköz neve' : 'Név'}</h2>
    <label class="field"><input id="dn" value="${esc(device || 'PDA-1')}" maxlength="20" aria-label="Eszköz neve"></label>
    <div class="row"><button class="btn pri" id="ok">Mentés</button></div>`);
  d.oncancel = e => { if (!device) e.preventDefault(); };
  const go = () => { const v = d.querySelector('#dn').value.trim(); if (!v) return; device = v; ls.set('rk_device', v); d.close(); update(); };
  d.querySelector('#ok').onclick = go;
  d.querySelector('#dn').onkeydown = e => { if (e.key === 'Enter') go(); };
  d.querySelector('#dn').select();
}
$('#dev').onclick = () => askDevice(false);
$('#mut').onclick = () => { muted = !muted; ls.set('rk_mute', muted ? '1' : '0'); renderChrome(); };

// ---------- inditas ----------
async function tick(full) {
  await chain;
  await flushQ();
  await refreshData(full);
  loading = false; update();
}
window.addEventListener('online', () => tick(false));
window.addEventListener('offline', () => { D.online = false; renderChrome(); });
if (!device) askDevice(true);
if (loadCache()) loading = false;
update();
tick(true);
setInterval(() => tick(false), 8000);
watch(() => update());
</script>
</body>
</html>
