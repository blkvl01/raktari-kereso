<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raktári kereső - Admin</title>
<link rel="stylesheet" href="common.css?v=25">
<style>
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100dvh}
aside{background:var(--side);color:var(--side-ink);padding:var(--s4) var(--s3);position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s2) var(--s4)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 8px 20px -8px var(--accent);transition:transform .5s var(--spring)}
.logo:hover{transform:rotate(-10deg) scale(1.06)}
.brand b{color:#f4f6fb;font-size:16px;letter-spacing:-.01em}
.links{position:relative;display:flex;flex-direction:column;gap:2px}
.navind{position:absolute;left:0;right:0;top:0;height:42px;border-radius:10px;background:var(--accent);box-shadow:0 8px 18px -10px var(--accent);transition:transform .5s var(--spring),height .3s;z-index:0}
aside a{position:relative;z-index:1;display:flex;align-items:center;gap:var(--s3);padding:10px var(--s3);border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:650;font-size:14px;transition:color .25s,background .2s}
aside a:hover{color:#f4f6fb}
aside a:not([aria-current=page]):hover{background:var(--side-line)}
aside a[aria-current=page]{color:var(--accent-ink)}
aside a svg{transition:transform .4s var(--spring)}
aside a:hover svg,aside a[aria-current=page] svg{transform:scale(1.12)}
aside a .cnt{margin-left:auto;font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--side-line);color:#f4f6fb;transition:background .25s}
aside a[aria-current=page] .cnt{background:rgb(255 255 255 / .22);color:inherit}
aside a .cnt.hot{background:var(--warn-strong);color:var(--warn-strong-ink)}
aside .foot{margin-top:auto;padding:var(--s3) var(--s2) 0;font-size:11px;opacity:.6}
.top{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s5);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:22px;letter-spacing:-.02em;flex:1}
.gsearch{position:relative;width:min(320px,34vw)}
.gsearch input{width:100%;padding:9px 12px 9px 38px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:14px;transition:box-shadow .25s,border-color .25s,background .25s}
.gsearch input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.gsearch .lead{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}
main{padding:var(--s5);max-width:1480px}
main.enter{animation:secIn .45s var(--ease-out)}
@keyframes secIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
.enter .st{animation:rise .55s var(--ease-out) both;animation-delay:calc(var(--i,0) * 55ms)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-small);color:var(--mute);font-weight:600}
.sync.off{color:var(--bad);font-weight:800}
#rf svg{transition:transform .6s var(--ease-out)}
#rf.spin svg{transform:rotate(360deg)}

.grid{display:grid;gap:var(--s4)}
.g-hero{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g-2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g-awb{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.hero{display:flex;gap:var(--s5);align-items:center;padding:var(--s5);background:linear-gradient(135deg,var(--surface),var(--accent-soft))}
.legend{flex:1;display:grid;gap:var(--s3);min-width:0}
.lg{display:flex;align-items:center;gap:var(--s3)}
.lg .sw{width:12px;height:12px;border-radius:4px;flex:none}
.lg b{font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-left:auto}
.donut-c{position:relative;flex:none}
.donut-c .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-c .mid b{font-size:40px;letter-spacing:-.03em;line-height:1}
.enter .seg{animation:seg 1s .2s var(--ease-out) both}
.enter .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .25s var(--ease-out) forwards}
.enter .ar{animation:fadeIn .9s .6s both}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px;transition:transform .3s var(--spring),box-shadow .25s}
.kpi:hover{transform:translateY(-3px)}
.kpi .ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:var(--s2)}
.kpi b{font-size:30px;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mute);font-weight:650}
.attn a{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);color:inherit;text-decoration:none;border-bottom:1px solid var(--line-2);transition:background .15s,padding .25s var(--ease-out)}
.attn a:last-child{border-bottom:0}
.attn a:hover{background:var(--accent-soft);padding-left:calc(var(--s4) + 6px)}
.attn .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.attn .ic.warn{background:var(--warn-soft);color:var(--warn)}.attn .ic.bad{background:var(--bad-soft);color:var(--bad)}.attn .ic.ok{background:var(--ok-soft);color:var(--ok)}
.attn .t{flex:1;min-width:0;font-weight:650}
.attn b{font-size:20px;font-variant-numeric:tabular-nums}
.chartbox{padding:var(--s4)}
.awbc{padding:var(--s4);display:grid;gap:var(--s3)}
.awbc:hover{transform:translateY(-3px)}
.awbc .no{font-size:17px;font-weight:800;letter-spacing:.01em}
.seg3{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.seg3 i{display:block;height:100%;transform-origin:left;transition:width .6s var(--ease-out)}
.enter .seg3 i{animation:grow .9s .3s var(--ease-out) both}
@keyframes grow{from{transform:scaleX(0)}}
.nums{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:var(--t-small);color:var(--mute)}.nums b{color:var(--ink);font-size:16px;display:block}
.scroll{max-height:560px;overflow:auto}
.tools{display:flex;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap;align-items:center}
.tools .inp{width:260px;min-height:40px;padding:6px 12px}
.pg{font-size:var(--t-small);color:var(--mute);padding:var(--s2) var(--s4)}
.lrow{display:flex;align-items:center;gap:var(--s3);width:100%;padding:10px var(--s4);border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;cursor:pointer;transition:background .15s}
.lrow:hover:not(:disabled){background:var(--accent-soft)}
.lrow .box{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;flex:none;transition:background .2s,transform .3s var(--spring)}
.lrow[aria-pressed=true] .box{background:var(--ok-strong);border-color:var(--ok-strong);color:var(--ok-strong-ink);transform:scale(1.1)}
.lrow .t{flex:1;min-width:0}.lrow .t small{display:block;color:var(--mute)}
tbody tr{transition:background .15s}
.lblform{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:end;margin-bottom:var(--s3)}
.lblform .field{margin:0}.lblform .field input{width:110px}
.g-lbl{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
textarea.inp{min-height:90px;font-family:ui-monospace,Consolas,monospace}
.onb{display:grid;justify-items:center;text-align:center;gap:var(--s3);padding:var(--s6) var(--s4)}
.onb .big{width:84px;height:84px;border-radius:24px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;animation:springIn .6s var(--ease-out)}
.onb h2{margin:0;font-size:24px;letter-spacing:-.02em}
.dz{border:2px dashed var(--accent-line);border-radius:var(--r);background:var(--accent-soft);padding:var(--s6) var(--s4);display:grid;justify-items:center;gap:var(--s2);text-align:center;transition:background .2s,border-color .2s,transform .3s var(--spring)}
.dz.over{background:var(--surface);border-color:var(--accent);transform:scale(1.015)}
.dz .big{width:64px;height:64px;border-radius:20px;background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:var(--sh);transition:transform .4s var(--spring)}
.dz.over .big{transform:translateY(-6px) scale(1.08)}
.dz h2{margin:0;font-size:19px}
.fcard{padding:var(--s4);display:grid;gap:var(--s3);animation:springIn .4s var(--ease-out)}
.fcard .hd2{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.fcard .no{font-size:20px;font-weight:800;letter-spacing:.01em}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap}
.cov{display:grid;gap:6px}
.cov .bar i{transition:width .8s var(--ease-out)}
.steps{display:flex;gap:var(--s2);margin-bottom:var(--s4);flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:var(--s2);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:14px;color:var(--mute);transition:background .3s,border-color .3s,color .3s}
.stp .n{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink);transition:background .3s,transform .4s var(--spring)}
.stp.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.stp.on .n{background:var(--accent);color:var(--accent-ink);transform:scale(1.15)}
.stp.done .n{background:var(--ok-strong);color:var(--ok-strong-ink)}
#labels{display:none}
/* cimke: teljes azonosito, az utolso 4 szamjegy nagyobb, alatta vonalkod. Elonezetben es nyomtatasban ugyanaz. */
.lbl{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5mm;padding:2mm;overflow:hidden;color:#000;background:#fff}
.lbl .lid{font-family:ui-monospace,Consolas,"Roboto Mono",monospace;font-weight:700;line-height:1.1;white-space:nowrap}
.lbl .lid b{font-size:1.45em;font-weight:900;margin-left:.06em}
.lbl svg{display:block;width:100%;flex:none}
.lblprev{display:grid;place-items:center;padding:var(--s5) var(--s4);background:var(--surface-2);overflow:auto;min-height:220px}
.lblprev .lbl{box-shadow:0 2px 12px rgb(0 0 0 / .22);border-radius:1.5mm}
/* kereso */
.xsrch{padding:var(--s4);display:grid;gap:var(--s3)}
.xin-wrap{position:relative}
.xin-wrap .lead{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none;display:flex}
.xin-wrap .inp{padding:14px 16px 14px 50px;font-size:19px;border-radius:12px;background:var(--surface-2);transition:box-shadow .25s,border-color .25s,background .25s}
.xin-wrap .inp:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.xhead{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding:var(--s4)}
.xhead .grow{flex:1;min-width:220px}
.xhead .ttl{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.xhead .acts{display:flex;gap:var(--s2);flex-wrap:wrap}
.facts{display:flex;flex-wrap:wrap;margin-left:-1px}
.facts>div{flex:1 1 180px;padding:var(--s3) var(--s4);border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);min-width:0}
.facts>div>span{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.facts>div>b{display:block;font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.facts>div>small{display:block;color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.notes{display:grid;gap:var(--s2);margin-bottom:var(--s4)}
.note{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r-sm);background:var(--accent-soft);border:1px solid var(--accent-line);font-size:14px}
.note>svg{margin-top:2px}
.note.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}
.note.mute{background:var(--surface-2);border-color:var(--line);color:var(--mute)}
.g-x{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
.lnk{background:none;border:0;padding:0;font:inherit;font-weight:700;color:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--accent-line);text-underline-offset:3px}
.lnk:hover{color:var(--accent);text-decoration-color:var(--accent)}
.xhelp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s4)}
.xhelp .card{padding:var(--s4);display:grid;gap:6px;align-content:start}
.xhelp .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:var(--s1)}
@media (max-width:1100px){.g-hero,.g-lbl,.g-x{grid-template-columns:1fr}}
@media (max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;overflow:visible}.links{flex-direction:row;flex-wrap:wrap}.navind{display:none}aside a[aria-current=page]{background:var(--accent)}aside .foot{display:none}main{padding:var(--s3)}.top{padding:var(--s3)}.gsearch{display:none}.hero{flex-direction:column;align-items:flex-start}.g-2{grid-template-columns:1fr}}
@media print{
  body{background:#fff;color:#000}.shell,dialog,#toast{display:none!important}
  #labels{display:block}
  #labels .lbl{page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<div class="shell">
  <aside id="nav" aria-label="Fő menü"></aside>
  <div>
    <header class="top">
      <h1 id="ttl"></h1>
      <form class="gsearch" id="gs" autocomplete="off"><span class="lead"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span><input id="gq" placeholder="Doboz, SKU vagy AWB" aria-label="Gyorskereső"></form>
      <span class="sync" id="sync" role="status" aria-live="polite"></span>
      <button class="btn sm" id="rf" aria-label="Frissítés"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="labels"></div>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/cfb@1.2.2/dist/cfb.min.js" integrity="sha384-peTByNpmIz2Wq5hOZJ3dZmZP4MJ6ZXwF9dZ3R8kW7/C6bMWdHEME3on5mt9DH7d5" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js" integrity="sha384-Kk5SjBOKprEnGfyBWfD2zROFd1Cu8kwOXxG2GIhYPcoDL2rBJS9P8Ud1ZMy4412a" crossorigin="anonymous"></script>
<script src="common.js?v=25"></script>
<script src="import.js?v=25"></script>
<script>
ICON.tag = '<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 7.5h.01"/>';
ICON.back = '<path d="M15 18l-6-6 6-6"/>';
const SECS = [['overview', 'Áttekintés', 'chart'], ['search', 'Kereső', 'search'], ['import', 'Importálás', 'up'], ['cartons', 'Dobozok', 'box'], ['parked', 'Félretett', 'layers'], ['skus', 'SKU-k', 'tag'], ['diffs', 'Eltérések', 'alert'],
  ['log', 'Napló', 'list'], ['devices', 'Eszközök', 'users'], ['labels', 'Címkék', 'print'], ['settings', 'Beállítások', 'gear']];
let adminCode = ls.get('rk_admin') || '';
let sec = 'overview', XT = null;               // XT: a keresoben megnyitott doboz / termek / AWB ({t, id})
// #szekcio vagy #search/<carton|sku|awb>/<azonosito>
function readHash() {
  let h = (location.hash || '#overview').slice(1);
  try { h = decodeURIComponent(h); } catch (e) {}
  const [s, t, ...r] = h.split('/');
  sec = SECS.some(x => x[0] === s) ? s : 'overview';
  XT = sec === 'search' && ['carton', 'sku', 'awb'].includes(t) && r.join('/') ? {t, id: r.join('/')} : null;
  if (XT) xRemember(XT);
}
readHash();
let SC = [];
let F = {lawbf: '', cst: 'felvett', cq: '', cawb: '', sq: '', lq: '', lres: '', lmode: 'felvett', ltxt: '', xq: '', xm: '', xaf: ''};
let loading = true, shownSec = '';
let IM = {files: [], pw: '', dict: null, dictInfo: '', busy: false, stage: 'pick', done: null};
const M = $('#main');

// a #main csak akkor rajzolodik ujra, ha a tartalma valtozott (nincs villogas, nem ugrik a gorgetes)
(() => {
  const d = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  Object.defineProperty(M, 'innerHTML', {get() { return d.get.call(this); }, set(v) { if (this._h === v) return; d.set.call(this, v); this._h = v; }});
})();

const RES = {open1: ['találat, 1 doboz', 'ok'], openN: ['találat, több doboz', 'ok'], closed: ['nincs nyitott dobozban', 'warn'], surplus: ['felesleg', 'warn'],
  unknown: ['ismeretlen', 'bad'], opened: ['felvéve', 'ok'], already: ['már felvéve', 'mute'], done: ['kész doboz', 'warn'],
  line_done: ['tétel kész', 'ok'], line_undone: ['tétel visszavonva', 'mute'], ident: ['azonosításhoz', 'mute'], ident_pick: ['azonosítva', 'ok'], pack: ['csomagolva', 'ok'], aside: ['félretéve', 'warn'], newbox: ['új doboz nyitva', 'ok'], move: ['áttéve', 'mute'], built: ['összerakva a polcról', 'ok']};
const resTag = r => { const x = RES[r] || [r, 'mute']; return `<span class="tag ${x[1]}">${esc(x[0])}</span>`; };
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '0%';
const I = (n, c) => ic(n).replace('class="i"', `class="i ${c || ''}"`);
const stI = i => `st" style="--i:${Math.min(i, 12)}`;

// ---------- admin hivasok ----------
async function adm(fn, args) {
  const {data, error} = await sb.rpc(fn, {p_code: adminCode, ...(args || {})});
  if (error) { toast('Hiba: ' + error.message); return null; }
  if (!data.ok && (data.error === 'bad' || data.error === 'locked')) {
    if (data.error === 'bad') { adminCode = ''; ls.del('rk_admin'); login(); } else toast('Túl sok próbálkozás, várj 1 percet');
    return null;
  }
  return data;
}
async function loadScans() { if (!adminCode) return; const r = await adm('rk_admin_scans', {p_limit: 2000}); if (r) SC = r.rows; }
function login() {
  const d = dialog(`<h2>Admin belépés</h2>
    <label class="field"><input id="ac" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="6 számjegy" aria-label="Admin kód" style="text-align:center;font-size:24px;letter-spacing:.4em"></label>
    <div class="err" id="ae" role="alert"></div><div class="row"><button class="btn pri block" id="ok">Belépés</button></div>`);
  d.oncancel = e => e.preventDefault();
  const go = async () => {
    const b = d.querySelector('#ok'); b.setAttribute('aria-busy', 'true'); b.disabled = true;
    const code = d.querySelector('#ac').value;
    if (!/^\d{6}$/.test(code)) { b.removeAttribute('aria-busy'); b.disabled = false; d.querySelector('#ae').textContent = '6 számjegy kell.'; return; }
    const {data, error} = await sb.rpc('rk_admin_login', {p_code: code});
    b.removeAttribute('aria-busy'); b.disabled = false;
    if (error) { d.querySelector('#ae').textContent = 'Hiba: ' + error.message; return; }
    if (data.ok) { adminCode = code; ls.set('rk_admin', code); d.close(); tick(); }
    else d.querySelector('#ae').textContent = data.error === 'locked' ? 'Túl sok próbálkozás, várj 1 percet.' : 'Hibás kód.';
  };

// ---------- szamitasok ----------
function overall() {
  const cartons = [...D.byCarton.keys()];
  const st = {total: cartons.length, open: 0, done: 0, none: 0, lines: 0, linesDone: 0, qty: 0, qtyDone: 0};
  cartons.forEach(c => {
    const s = cartonStatus(c); if (!s) { st.none++; return; }
    s === 'open' ? st.open++ : st.done++;
    D.byCarton.get(c).forEach(l => { st.lines++; st.qty += l.qty; if (isLineDone(l) || s === 'done') { st.linesDone++; st.qtyDone += l.qty; } });
  });
  return st;
}
function ambiguous() {
  const out = [];
  D.byKey.forEach((ls_, key) => {
    const t = ls_.filter(l => cartonStatus(l.carton) === 'open' && !isLineDone(l));
    if (t.length >= 2) out.push({key, lines: t, descr: ls_[0].descr, qty: t.reduce((a, l) => a + l.qty, 0)});
  });
  return out.sort((a, b) => b.lines.length - a.lines.length);
}
const skuScans = () => SC.filter(s => s.kind === 'sku');
function devStats() {
  const m = new Map();
  SC.forEach(s => {
    const d = m.get(s.device) || {name: s.device, scans: 0, sku: 0, hit: 0, opened: 0, lines: 0, last: 0};
    d.last = Math.max(d.last, +new Date(s.ts));
    if (s.kind === 'sku') { d.sku++; d.scans++; if (s.result === 'open1' || s.result === 'openN') d.hit++; }
    if (s.kind === 'carton') { d.scans++; if (s.result === 'opened') d.opened++; }
    if (s.kind === 'line' && s.result === 'line_done') d.lines++;
    m.set(s.device, d);
  });
  return [...m.values()].sort((a, b) => b.last - a.last);
}
// hiany: nyitott doboz nem kesz tetele, vagy hianyal lezart doboz tetele, amibol kevesebb kerult a dobozba
const missingLines = () => D.lines.filter(l => { const s = cartonStatus(l.carton); if (s === 'open') return !isLineDone(l); const r = D.lineDone.get(l.id); return s === 'done' && !!r && r.got != null && r.got < l.qty; });
function aggScans(rows, keyf) {
  const m = new Map();
  rows.forEach(s => { const k = keyf(s), x = m.get(k) || {k, n: 0, last: 0, dev: new Set()}; x.n++; x.last = Math.max(x.last, +new Date(s.ts)); x.dev.add(s.device); m.set(k, x); });
  return [...m.values()].sort((a, b) => b.n - a.n);
}
function attention() {
  const sk = skuScans(), amb = ambiguous();
  return {
    unk: aggScans(sk.filter(s => s.result === 'unknown'), s => s.raw).length,
    closed: aggScans(sk.filter(s => s.result === 'closed' || s.result === 'surplus'), s => s.key || s.raw).length,
    ucart: aggScans(SC.filter(s => s.kind === 'carton' && s.result === 'unknown'), s => s.raw).length,
    miss: missingLines().length, amb: amb.length
  };
}

// ---------- abrak ----------
function donut(parts, size, w) {
  const r = (size - w) / 2, c = 2 * Math.PI * r, total = parts.reduce((a, p) => a + p.v, 0); let off = 0;
  const segs = total ? parts.filter(p => p.v > 0).map(p => { const len = c * p.v / total; const el = `<circle class="seg" style="--c:${c}" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${w}" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}"><title>${esc(p.label)}: ${p.v}</title></circle>`; off += len; return el; }).join('') : '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Dobozok állapota" style="transform:rotate(-90deg)"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${w}"/>${segs}</svg>`;
}
function areaChart(vals, labels) {
  const W = 640, H = 170, pl = 8, pr = 8, pt = 14, pb = 22, mx = Math.max(4, ...vals), n = vals.length;
  const x = i => pl + (W - pl - pr) * i / (n - 1), y = v => pt + (H - pt - pb) * (1 - v / mx);
  const pts = vals.map((v, i) => [x(i), y(v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${x(n - 1).toFixed(1)} ${H - pb} L${x(0).toFixed(1)} ${H - pb} Z`;
  const grid = [0, .5, 1].map(f => { const yy = pt + (H - pt - pb) * (1 - f); return `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="var(--line-2)"/><text x="${W - pr}" y="${yy - 3}" text-anchor="end" font-size="10" fill="var(--mute)">${Math.round(mx * f)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Szkennelések 10 percenként"><defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path class="ar" d="${area}" fill="url(#ag)"/><path class="ln" pathLength="1" d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => vals[i] ? `<circle class="ar" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"><title>${labels[i]}: ${vals[i]}</title></circle>` : '').join('')}
    <text x="${pl}" y="${H - 5}" font-size="10" fill="var(--mute)">${labels[0]}</text><text x="${W - pr}" y="${H - 5}" text-anchor="end" font-size="10" fill="var(--mute)">most</text></svg>`;
}

// ---------- felretett polc ----------
// a naplo szerint nyitott doboz nelkul szkennelt termekek (v2.2 elotti "nincs nyitott dobozban"), amelyeknek most sincs
// nyitott doboza, de meg nyitatlan dobozba kellenek: valoszinuleg felre vannak teve, de nincsenek a polcon nyilvantartva
function orphans() {
  return aggScans(SC.filter(s => s.kind === 'sku' && s.result === 'closed' && s.key && D.byKey.has(s.key)), s => s.key).map(x => {
    const ls_ = D.byKey.get(x.k);
    return {...x, open: ls_.some(l => cartonStatus(l.carton) === 'open' && lineGot(l) < l.qty), free: ls_.filter(l => !cartonStatus(l.carton)).reduce((a, l) => a + l.qty - lineGot(l), 0), parked: D.parked.get(x.k) || 0};
  }).filter(x => !x.open && x.free > x.parked).map(x => ({...x, add: Math.min(x.n, x.free) - x.parked})).filter(x => x.add > 0);
}
async function orphanToShelf(list) {

// ---------- eltérések, napló, eszközök ----------
function vDiffs() {
  const sk = skuScans();
  const unk = aggScans(sk.filter(s => s.result === 'unknown'), s => s.raw);
  const cl = aggScans(sk.filter(s => s.result === 'closed' || s.result === 'surplus'), s => s.key || s.raw);

const LBL_SIZES = [[100, 50], [100, 70], [100, 150], [60, 40]];

// soronkent vagy vesszovel: teljes azonosito (goodslistben nem levo is), 10 szamjegy, vagy egyertelmu vegzodes (min. 4 szamjegy)
function parseLabelText(t) {
  const ok = [], unknown = [], bad = [];
  t.split(/[\s,;]+/).filter(Boolean).forEach(x => {
    const u = x.toUpperCase(), d = u.replace(/\D/g, '');
    let c = CARTON_RE.test(u) ? u : d.length === 10 ? D.cartonByDigits.get(d) || 'RQ-XPW' + d : null;
    if (!c && d.length >= 4 && d.length < 10) {
      const m = [...D.byCarton.keys()].filter(k => k.endsWith(d));
      if (m.length !== 1) { bad.push(x + (m.length ? ` (${m.length} doboz)` : '')); return; }
      c = m[0];
    }
    if (!c) { bad.push(x); return; }
    if (ok.includes(c)) return;
    ok.push(c); if (!D.byCarton.has(c)) unknown.push(c);
  });
  return {ok, unknown, bad};
}
function labelList() {
  if (F.lmode === 'lista') return parseLabelText(F.ltxt || '');
  const o = [...D.open.values()];
  const cs = F.lmode === 'nyitott' ? o.filter(x => x.status === 'open').map(x => x.carton) : F.lmode === 'kesz' ? o.filter(x => x.status === 'done').map(x => x.carton)

  return {ok: cs.sort(), unknown: [], bad: []};
}

function gotX(l) { return cartonStatus(l.carton) === 'done' && !D.lineDone.get(l.id) ? l.qty : lineGot(l); }
function lineState(l) {
  const s = cartonStatus(l.carton), g = gotX(l);
  if (g >= l.qty) return ['kész', 'ok'];
  if (s === 'done') return [`hiány: ${l.qty - g} db`, 'bad'];
  if (s === 'open') return [g ? `${g}/${l.qty} db` : 'még kell', ''];
  return ['nincs felvéve', 'mute'];
}
function stTag(c) {
  if (!D.byCarton.has(c)) return '<span class="tag bad">nincs a goodslistben</span>';
  const s = cartonStatus(c);
  return s === 'done' ? '<span class="tag ok">kész</span>' : s === 'open' ? '<span class="tag">nyitott</span>' : '<span class="tag mute">nincs felvéve</span>';
}
function cartonSum(c) {
  const ls_ = D.byCarton.get(c) || [], done = cartonStatus(c) === 'done';
  const p = {n: ls_.length, qty: 0, got: 0, done: 0, short: 0, kg: 0};
  ls_.forEach(l => { const g = gotX(l); p.qty += l.qty; p.got += g; p.kg += +l.gw || 0; if (g >= l.qty) p.done++; else if (done) p.short++; });
  p.ratio = p.qty ? p.got / p.qty : 0; return p;
}

const xLogCard = (title, rows, opt, i) => `<div class="card ${stI(i)}"><div class="hd"><h2>${title}</h2><span class="meta">${rows.length} bejegyzés</span></div><div class="scroll">${xLogTable(rows, opt)}</div></div>`;

// talalatok tipusonkent; exact: pontos egyezes (teljes doboz azonosito, termek kulcs, AWB szam)
function xFind(q, mode) {
  const u = q.trim().toUpperCase().replace(/\s+/g, ''), d = u.replace(/\D/g, ''), low = q.trim().toLowerCase();
  const r = {carton: [], sku: [], awb: [], exact: null, u, n: 0};
  if (u.length < 3) return r;
  const want = t => !mode || mode === t, onlyNum = /^[\d-]+$/.test(u);
  if (want('carton')) {
    if (CARTON_RE.test(u)) { r.carton = [u]; r.exact = {t: 'carton', id: u}; }      // goodslistben nem levo is: a naplo latszik
    else if (d.length === 10 && onlyNum && D.cartonByDigits.has(d)) { const c = D.cartonByDigits.get(d); r.carton = [c]; r.exact = {t: 'carton', id: c}; }
    else if (d.length >= 4 && onlyNum) r.carton = [...D.byCarton.keys()].filter(c => c.replace(/\D/g, '').endsWith(d)).sort();
    else if (/^(RQ|XPW)/.test(u)) { const p = u.replace(/^(RQ-?)?XPW/, 'RQ-XPW'); r.carton = [...D.byCarton.keys()].filter(c => c.startsWith(p)).sort(); }
  }
  if (want('sku')) {
    const key = u.split('-')[0].replace(/\D/g, '').replace(/^0+/, ''), name = /\p{L}/u.test(low) && low.length >= 3;
    if (onlyNum && key && D.byKey.has(key)) { r.sku = [key]; r.exact = r.exact || {t: 'sku', id: key}; }
    else if ((onlyNum && d.length >= 4) || name) {
      const hit = k => { const l0 = D.byKey.get(k)[0]; return onlyNum ? k.includes(d) : (l0.descr || '').toLowerCase().includes(low) || (l0.mat || '').toLowerCase().includes(low); };
      r.sku = [...D.byKey.keys()].filter(hit).sort((a, b) => keyName(a).localeCompare(keyName(b), 'hu'));
    }
  }
  if (want('awb')) {
    r.awb = [...D.awbs.values()].filter(a => onlyNum ? d.length >= 4 && a.id.includes(d) : a.id.toUpperCase().includes(u) || (a.mark || '').toUpperCase().replace(/\s+/g, '').includes(u)).map(a => a.id).sort();
    const ex = r.awb.find(id => id.toUpperCase() === u); if (ex) r.exact = {t: 'awb', id: ex};
  }
  r.n = r.carton.length + r.sku.length + r.awb.length;
  return r;
}
const xTarget = r => r.exact || (r.n === 1 ? (r.carton.length ? {t: 'carton', id: r.carton[0]} : r.sku.length ? {t: 'sku', id: r.sku[0]} : {t: 'awb', id: r.awb[0]}) : null);
// Enter: egyertelmu talalat megnyitasa. Ha a keresesnek egyetlen talalata volt, a mezo kiurul, hogy a Vissza ne ugyanezt mutassa ujra;
// tobb talalatnal megmarad, a Vissza a listara ter vissza.
function xOpen(q, mode) {

}

function xAwb(id) {

  if (full.length) nt.push(note('ok', 'layers', `<b>${full.length} fel nem vett doboz összegyűlt</b> a félretett polcon, összerakható.`));
  if (by.done.length === cs.length) nt.push(note('ok', 'check', 'Minden doboz kész.'));
  const ord = {open: 0, done: 1, none: 2}, list = (F.xaf ? by[F.xaf] : cs).slice().sort((x, y) => ord[cartonStatus(x) || 'none'] - ord[cartonStatus(y) || 'none'] || x.localeCompare(y));
  const chips = [['', 'Mind', cs.length], ['open', 'Nyitott', by.open.length], ['done', 'Kész', by.done.length], ['none', 'Nincs felvéve', by.none.length]]
    .map(([k, n, v]) => `<button class="chip" data-xaf="${k}" aria-pressed="${F.xaf === k}">${n} <b>${v}</b></button>`).join('');
  const rows = list.map(c => { const o = D.open.get(c), p = cartonSum(c);
    return `<tr class="clk" ${go('carton', c)}><td>${idHtml(c)}</td><td>${stTag(c)}${claimOf(c) ? ` <span class="tag warn">${esc(claimOf(c))}</span>` : ''}</td><td class="n">${p.done}/${p.n}</td>
      <td style="min-width:120px"><b>${p.got}/${p.qty} db</b>${xBar(p.got, p.qty)}</td><td>${o ? esc(o.opened_by || '') + `<div class="meta">${fmtDT(o.opened_at)}</div>` : ''}</td></tr>`; }).join('');
  return `<div class="card ${stI(0)}" style="margin-bottom:var(--s4)">${xHead(`<span class="mono">${esc(id)}</span>`, a.mark ? `<span class="tag">${esc(a.mark)}</span>` : '', '', esc(a.file || ''))}
    <div style="padding:0 var(--s4) var(--s4)"><div class="seg3" role="img" aria-label="${by.done.length} kész, ${by.open.length} nyitott, ${by.none.length} nincs felvéve"><i style="width:${100 * by.done.length / (cs.length || 1)}%;background:var(--ok-strong)"></i><i style="width:${100 * by.open.length / (cs.length || 1)}%;background:var(--accent)"></i></div></div>
    ${facts([
      ['Dobozok', cs.length, `${by.done.length} kész · ${by.open.length} nyitott · ${by.none.length} nincs felvéve`],
      ['Darab', `${got}/${qty}`, pct(got, qty) + ' bekerült'],
      ['Tétel', lines.length, ''],
      ['Súly', kg.toFixed(1) + ' kg', ''],
      ['Betöltve', fmtDT(a.loaded_at), ''],
      ['Eszközök', dev.length ? esc(dev.join(', ')) : '-', log[0] ? 'utoljára ' + fmtDT(log[0].ts) : '']])}</div>
    ${notesHtml(nt, 1)}
    <div class="grid g-x">
      <div class="grid" style="gap:var(--s4)">
        <div class="card ${stI(2)}"><div class="hd"><h2>Dobozok</h2></div><div class="chips" style="padding:var(--s3) var(--s4) 0">${chips}</div>
          <div class="scroll">${rows ? `<table><thead><tr><th>Doboz</th><th>Státusz</th><th class="n">Tétel</th><th>Darab</th><th>Felvette</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty"><b>Nincs ilyen doboz</b></div>'}</div></div>
        ${short.length ? `<div class="card ${stI(3)}"><div class="hd"><h2>Hiányzó tételek</h2><span class="meta">${short.length} tétel</span></div><div class="scroll"><table><thead><tr><th>Doboz</th><th>Termék</th><th class="n">Hiány</th></tr></thead><tbody>${short.map(l =>
          `<tr><td>${lnk('carton', l.carton, idHtml(l.carton))}</td><td>${lnk('sku', l.key, esc(l.descr))}<div class="mono meta">${esc(l.sku)}</div></td><td class="n"><b>${l.qty - gotX(l)}</b> / ${l.qty}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
      </div>
      ${xLogCard('Napló', log, {prod: 1, carton: 1}, 4)}</div>`;
}

// ---------- gyorskereso (fejlec) ----------
$('#gs').onsubmit = e => {
  e.preventDefault(); const v = $('#gq').value.trim(); if (!v) return;
  $('#gq').value = ''; $('#gq').blur(); F.xm = '';
  if (xOpen(v, '')) return;
  F.xq = v;
  if (location.hash === '#search') render(true); else location.hash = '#search';
};

// ---------- inditas ----------
async function tick(full) {
  await refreshData(!!full);
  await loadScans();
  loading = false; render();
}
const th = ls.get('rk_theme'); if (th) document.documentElement.dataset.theme = th;
if (ls.get('rk_gpw_rem') === '1') IM.pw = sessionStorage.getItem('rk_gpw') || '';
loadDict().then(r => { IM.dict = r.dict; IM.dictInfo = r.dict ? `${r.source}, ${r.dict.revision}. rev.` : 'Szótár nem elérhető'; const di = $('#di'); if (di) di.innerHTML = r.dict ? `Szótár: ${IM.dictInfo}, ${r.dict.entries.size} szó` : `<span class="err">${esc(IM.dictInfo)}</span>`; });
$('#rf').onclick = async () => { const b = $('#rf'); b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin'); await tick(true); setTimeout(() => b.classList.remove('spin'), 700); };
buildNav();
if (!adminCode) login();
if (loadCache()) loading = false;
render();
tick(true);
setInterval(() => tick(false), 6000);
watch(() => render());
</script>
</body>
</html>
