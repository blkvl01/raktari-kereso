<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raktári kereső - Admin</title>
<link rel="stylesheet" href="common.css">
<style>
body{--t-body:15px}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100dvh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:var(--s4) var(--s3);position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:var(--s1)}
aside h1{font-size:16px;margin:0 var(--s2) var(--s3)}
aside a{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s3);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
aside a:hover{background:var(--accent-soft)}
aside a[aria-current=page]{background:var(--accent);color:var(--accent-ink)}
aside .foot{margin-top:auto;padding:var(--s2)}
.top{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s5);border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top h2{margin:0;font-size:18px;flex:1}
main{padding:var(--s5);max-width:1500px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s3);margin-bottom:var(--s4)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.tile .l{font-size:var(--t-small);color:var(--mute)}
.tile .v{font-size:34px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .s{font-size:var(--t-small);color:var(--mute)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:var(--s4);align-items:start}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding:var(--s3) var(--s4) var(--s2)}
.chart i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.chart i:hover{filter:brightness(1.2)}
.axis{display:flex;justify-content:space-between;padding:0 var(--s4) var(--s3);font-size:12px;color:var(--mute)}
.scroll{max-height:560px;overflow:auto}
.tools{display:flex;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap;align-items:center}
.tools .inp{width:260px;min-height:40px;padding:6px 12px}
.lrow{display:flex;align-items:center;gap:var(--s3);width:100%;padding:10px var(--s4);border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.lrow:hover{background:var(--accent-soft)}
.lrow .box{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;flex:none}
.lrow[aria-pressed=true] .box{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.lrow .t{flex:1;min-width:0}
.pg{font-size:var(--t-small);color:var(--mute);padding:var(--s2) var(--s4)}
.lblform{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:end;margin-bottom:var(--s3)}
.lblform .field{margin:0}.lblform .field input{width:110px}
textarea.inp{min-height:90px;font-family:ui-monospace,Consolas,monospace}
#labels{display:none}
@media (max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}aside .foot{display:none}main{padding:var(--s3)}}
@media print{
  body{background:#fff;color:#000}.shell,dialog,#toast{display:none!important}
  #labels{display:block}
  .lbl{page-break-after:always;break-after:page;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1mm;overflow:hidden;color:#000;background:#fff;font-family:system-ui,Arial,sans-serif}
  .lbl .big{font:800 var(--lbl-big,22mm)/1 ui-monospace,Consolas,monospace;letter-spacing:1mm}
  .lbl svg{max-width:92%;height:auto}
  .lbl .sm{font-size:3.2mm}
}
</style>
</head>
<body>
<div class="shell">
  <aside id="nav" aria-label="Fő menü"></aside>
  <div>
    <div class="top"><h2 id="ttl"></h2><span class="sync" id="sync" role="status" aria-live="polite"></span><button class="btn sm" id="rf">Frissítés</button></div>
    <main id="main"></main>
  </div>
</div>
<div id="labels"></div>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js" integrity="sha384-Kk5SjBOKprEnGfyBWfD2zROFd1Cu8kwOXxG2GIhYPcoDL2rBJS9P8Ud1ZMy4412a" crossorigin="anonymous"></script>
<script src="common.js"></script>
<script>
const SECS = [['overview', 'Áttekintés', 'chart'], ['cartons', 'Dobozok', 'box'], ['skus', 'SKU-k', 'search'], ['diffs', 'Eltérések', 'alert'], ['log', 'Napló', 'list'], ['devices', 'Eszközök', 'users'], ['labels', 'Címkék', 'print'], ['settings', 'Beállítások', 'gear']];
let adminCode = ls.get('rk_admin') || '';
let sec = (location.hash || '#overview').slice(1);
if (!SECS.some(s => s[0] === sec)) sec = 'overview';
let SC = [];                                   // szkennelesi naplo
let F = {cst: 'felvett', cq: '', cawb: '', sq: '', lq: '', lres: '', lsel: new Set(), lmode: 'felvett'};
let loading = true;

const RES = {open1: ['találat, 1 doboz', 'done'], openN: ['találat, több doboz', 'done'], closed: ['nincs nyitott dobozban', 'warn'], surplus: ['felesleg', 'warn'],
  unknown: ['ismeretlen', 'bad'], opened: ['doboz felvéve', 'done'], already: ['már felvett doboz', 'mute'], done: ['kész dobozt szkenneltek', 'warn'],
  line_done: ['tétel kész', 'done'], line_undone: ['tétel visszavonva', 'mute']};
const resTag = r => { const x = RES[r] || [r, 'mute']; return `<span class="tag ${x[1]}">${esc(x[0])}</span>`; };

// ---------- admin hivasok ----------
async function adm(fn, args) {
  const {data, error} = await sb.rpc(fn, {p_code: adminCode, ...(args || {})});
  if (error) { toast('Hiba: ' + error.message); return null; }
  if (!data.ok && (data.error === 'bad' || data.error === 'locked')) {
    if (data.error === 'bad') { adminCode = ''; ls.del('rk_admin'); login(); } else toast('Túl sok próbálkozás, várj 1 percet');
    return null;
  }
  return data;
}
async function loadScans() { if (!adminCode) return; const r = await adm('rk_admin_scans', {p_limit: 2000}); if (r) SC = r.rows; }
function login() {
  const d = dialog(`<h2>Admin belépés</h2><label class="field"><span>Admin kód</span><input id="ac" type="password" autocomplete="off"></label>
    <div class="err" id="ae" role="alert"></div><div class="row"><button class="btn pri" id="ok">Belépés</button></div>`);
  d.oncancel = e => e.preventDefault();
  const go = async () => {
    const b = d.querySelector('#ok'); b.setAttribute('aria-busy', 'true'); b.disabled = true;
    const code = d.querySelector('#ac').value;
    const {data, error} = await sb.rpc('rk_admin_login', {p_code: code});
    b.removeAttribute('aria-busy'); b.disabled = false;
    if (error) { d.querySelector('#ae').textContent = 'Hiba: ' + error.message; return; }
    if (data.ok) { adminCode = code; ls.set('rk_admin', code); d.close(); tick(); }
    else d.querySelector('#ae').textContent = data.error === 'locked' ? 'Túl sok próbálkozás, várj 1 percet.' : 'Hibás kód.';
  };
  d.querySelector('#ok').onclick = go; d.querySelector('#ac').onkeydown = e => { if (e.key === 'Enter') go(); }; d.querySelector('#ac').focus();
}

// ---------- szamitasok ----------
function overall() {
  const cartons = [...D.byCarton.keys()];
  const st = {total: cartons.length, open: 0, done: 0, lines: 0, linesDone: 0, qty: 0, qtyDone: 0};
  cartons.forEach(c => {
    const s = cartonStatus(c); if (!s) return;
    s === 'open' ? st.open++ : st.done++;
    D.byCarton.get(c).forEach(l => { st.lines++; st.qty += l.qty; if (isLineDone(l) || s === 'done') { st.linesDone++; st.qtyDone += l.qty; } });
  });
  return st;
}
function ambiguous() {
  const out = [];
  D.byKey.forEach((ls_, key) => {
    const t = ls_.filter(l => cartonStatus(l.carton) === 'open' && !isLineDone(l));
    if (t.length >= 2) out.push({key, lines: t, descr: ls_[0].descr, qty: t.reduce((a, l) => a + l.qty, 0)});
  });
  return out.sort((a, b) => b.lines.length - a.lines.length);
}
const skuScans = () => SC.filter(s => s.kind === 'sku');
function devStats() {
  const m = new Map();
  SC.forEach(s => {
    const d = m.get(s.device) || {name: s.device, scans: 0, sku: 0, hit: 0, opened: 0, lines: 0, last: 0, first: Infinity};
    const t = +new Date(s.ts);
    d.last = Math.max(d.last, t); d.first = Math.min(d.first, t);
    if (s.kind === 'sku') { d.sku++; d.scans++; if (s.result === 'open1' || s.result === 'openN') d.hit++; }
    if (s.kind === 'carton') { d.scans++; if (s.result === 'opened') d.opened++; }
    if (s.kind === 'line' && s.result === 'line_done') d.lines++;
    m.set(s.device, d);
  });
  return [...m.values()].sort((a, b) => b.last - a.last);
}
const missingLines = () => D.lines.filter(l => cartonStatus(l.carton) === 'open' && !isLineDone(l));

// ---------- megjelenites ----------
function renderNav() {
  $('#nav').innerHTML = `<h1>Raktári kereső</h1>` + SECS.map(([k, n, i]) => `<a href="#${k}" ${sec === k ? 'aria-current="page"' : ''}>${ic(i)}${n}</a>`).join('') +
    `<div class="foot meta">Admin felület. A PDA-k a főoldalról érhetők el.</div>`;
  $('#ttl').textContent = SECS.find(s => s[0] === sec)[1];
  $('#sync').className = 'sync' + (D.online ? '' : ' off');
  $('#sync').innerHTML = D.online ? ic('wifi') + 'Élő' : ic('off') + 'Nincs kapcsolat';
}
function render(force) {
  renderNav();
  if (loading) { $('#main').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; return; }
  const a = document.activeElement;
  if (!force && a && ['INPUT', 'TEXTAREA'].includes(a.tagName) && $('#main').contains(a)) return;
  if (!force && document.querySelector('dialog[open]')) return;
  ({overview: vOverview, cartons: vCartons, skus: vSkus, diffs: vDiffs, log: vLog, devices: vDevices, labels: vLabels, settings: vSettings})[sec]();
}
window.addEventListener('hashchange', () => { sec = (location.hash || '#overview').slice(1); if (!SECS.some(s => s[0] === sec)) sec = 'overview'; render(true); });

const tile = (l, v, s) => `<div class="tile"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s || ''}</div></div>`;
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '0%';

function vOverview() {
  const o = overall(), sk = skuScans(), now = Date.now();
  const hit = sk.filter(s => s.result === 'open1' || s.result === 'openN').length;
  const cnt = r => sk.filter(s => s.result === r).length;
  const last15 = SC.filter(s => (s.kind === 'sku' || s.kind === 'carton') && now - new Date(s.ts) < 15 * 60e3).length;
  const dv = devStats(), act = dv.filter(d => now - d.last < 5 * 60e3).length;
  const amb = ambiguous();
  // 10 perces bucketek, utolso 3 ora
  const B = 18, buckets = Array(B).fill(0);
  SC.forEach(s => { if (s.kind !== 'sku' && s.kind !== 'carton') return; const i = B - 1 - Math.floor((now - new Date(s.ts)) / 600e3); if (i >= 0 && i < B) buckets[i]++; });
  const mx = Math.max(1, ...buckets);
  const awbRows = [...D.awbs.values()].map(a => {
    const cs = [...new Set(D.lines.filter(l => l.awb === a.id).map(l => l.carton))];
    const dn = cs.filter(c => cartonStatus(c) === 'done').length, op = cs.filter(c => cartonStatus(c) === 'open').length;
    return `<div class="list-row"><div class="grow"><b>${esc(a.mark || '')}</b> <span class="meta mono">${esc(a.id)}</span>
      <div class="bar" style="margin-top:6px" role="img" aria-label="${dn} kész, ${op} nyitott, ${cs.length} összesen"><i style="width:${100 * dn / cs.length}%"></i><i class="o" style="width:${100 * op / cs.length}%"></i></div></div>
      <div class="meta" style="text-align:right">kész <b>${dn}</b> · nyitott <b>${op}</b><br>${cs.length} doboz összesen</div></div>`;
  }).join('') || '<div class="empty">Nincs betöltött AWB.</div>';
  const feed = SC.filter(s => s.kind !== 'line').slice(0, 14).map(s => `<tr><td class="mono">${fmtT(s.ts)}</td><td>${esc(s.device)}</td><td class="mono">${esc(s.raw)}</td><td>${resTag(s.result)}</td><td class="mono">${s.carton ? esc(short(s.carton)) : ''}</td></tr>`).join('');
  $('#main').innerHTML = `<div class="tiles">
    ${tile('Felvett dobozok', `${o.open + o.done}`, `${o.total} doboz a goodslistben · nyitott ${o.open}, kész ${o.done}`)}
    ${tile('Kész tételek', `${o.linesDone} / ${o.lines}`, `${o.qtyDone} / ${o.qty} db a felvett dobozokban`)}
    ${tile('Szkennelések', sk.length, `utolsó 15 percben: ${last15} (${(last15 / 15).toFixed(1)}/perc)`)}
    ${tile('Találati arány', pct(hit, sk.length), `ismeretlen ${cnt('unknown')} · nincs nyitott ${cnt('closed')} · felesleg ${cnt('surplus')}`)}
    ${tile('Aktív eszköz', `${act} / ${dv.length}`, 'utolsó 5 percben szkennelt')}
    ${tile('Többértelmű SKU', amb.length, 'több nyitott dobozba is tartozik')}</div>
    <div class="cols">
      <div class="card"><h2>AWB-k haladása</h2>${awbRows}</div>
      <div class="card"><h2>Szkennelés, 10 perces bontásban (utolsó 3 óra)</h2><div class="chart" role="img" aria-label="Szkennelések száma 10 percenként">${buckets.map((v, i) => `<i style="height:${Math.max(2, 100 * v / mx)}%" title="${v} szkennelés"></i>`).join('')}</div>
        <div class="axis"><span>3 órája</span><span>most</span></div></div>
      <div class="card" style="grid-column:1/-1"><h2>Élő napló</h2><div class="scroll"><table><thead><tr><th>Idő</th><th>Eszköz</th><th>Kód</th><th>Eredmény</th><th>Doboz</th></tr></thead><tbody>${feed || '<tr><td colspan="5" class="empty">Még nincs szkennelés.</td></tr>'}</tbody></table></div></div>
    </div>`;
}

function cartonRows() {
  let cs = [...D.byCarton.keys()];
  if (F.cawb) cs = cs.filter(c => D.byCarton.get(c)[0].awb === F.cawb);
  if (F.cq) cs = cs.filter(c => c.includes(F.cq));
  const m = {felvett: c => cartonStatus(c), nyitott: c => cartonStatus(c) === 'open', kesz: c => cartonStatus(c) === 'done', nincs: c => !cartonStatus(c), mind: () => true}[F.cst];
  return cs.filter(m).sort((a, b) => cartonProg(b).ratio - cartonProg(a).ratio || a.localeCompare(b));
}
function fillCartons() {
  const cs = cartonRows(), shown = cs.slice(0, 300);
  $('#ct').innerHTML = `<table><thead><tr><th>Doboz</th><th>AWB</th><th>Státusz</th><th>Hely</th><th class="n">Tételek</th><th class="n">Db</th><th>Haladás</th><th>Felvette</th><th>Idő</th></tr></thead><tbody>${shown.map(c => {
    const o = D.open.get(c), p = cartonProg(c), l0 = D.byCarton.get(c)[0];
    return `<tr class="clk" data-c="${esc(c)}"><td><b class="mono">${short(c)}</b><br><span class="meta">${esc(c)}</span></td><td>${awbTag(l0)}</td>
      <td>${o ? `<span class="tag ${o.status === 'done' ? 'done' : ''}">${o.status === 'done' ? 'kész' : 'nyitott'}</span>` : '<span class="tag mute">nincs felvéve</span>'}</td>
      <td>${esc(o && o.place || '')}</td><td class="n">${p.done}/${p.n}</td><td class="n">${p.qty}</td><td><div class="bar" style="width:90px"><i style="width:${Math.round(p.ratio * 100)}%"></i></div></td>
      <td>${esc(o && o.opened_by || '')}</td><td class="meta">${o ? fmtDT(o.opened_at) : ''}</td></tr>`;
  }).join('')}</tbody></table>${cs.length > 300 ? `<div class="pg">Az első 300 doboz látszik a(z) ${cs.length}-ból. Szűkítsd a keresést.</div>` : ''}${cs.length ? '' : '<div class="empty">Nincs találat.</div>'}`;
  $('#cc').textContent = cs.length + ' doboz';
}
function vCartons() {
  $('#main').innerHTML = `<div class="tools">
    ${[['felvett', 'Felvett'], ['nyitott', 'Nyitott'], ['kesz', 'Kész'], ['nincs', 'Nincs felvéve'], ['mind', 'Mind']].map(([k, n]) => `<button class="chip" data-st="${k}" aria-pressed="${F.cst === k}">${n}</button>`).join('')}
    <input class="inp" id="cq" placeholder="Doboz azonosító részlete" value="${esc(F.cq)}" aria-label="Keresés">
    <span class="meta">AWB:</span><button class="chip" data-aw="" aria-pressed="${!F.cawb}">Mind</button>${[...D.awbs.values()].map(a => `<button class="chip" data-aw="${esc(a.id)}" aria-pressed="${F.cawb === a.id}">${esc(a.mark || '')} ${esc(a.id.slice(-4))}</button>`).join('')}
    <span class="meta" id="cc"></span>
    <button class="btn sm" id="ex" style="margin-left:auto">${ic('dl')}Export CSV</button></div>
    <div class="card"><div class="scroll" id="ct"></div></div>`;
  fillCartons();
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { F.cst = b.dataset.st; vCartons(); });
  $('#cq').oninput = e => { F.cq = e.target.value.trim().toUpperCase(); fillCartons(); };
  document.querySelectorAll('[data-aw]').forEach(b => b.onclick = () => { F.cawb = b.dataset.aw; vCartons(); });
  $('#ct').onclick = e => { const r = e.target.closest('[data-c]'); if (r) showCarton(r.dataset.c); };
  $('#ex').onclick = () => csv([['AWB', 'Doboz', 'Státusz', 'Hely', 'Kész tétel', 'Összes tétel', 'Várt db', 'Felvette', 'Felvétel ideje']].concat(cartonRows().map(c => {
    const o = D.open.get(c), p = cartonProg(c); return [D.byCarton.get(c)[0].awb, c, o ? o.status : 'nincs felvéve', o && o.place, p.done, p.n, p.qty, o && o.opened_by, o && o.opened_at]; })), 'dobozok.csv');
}
function showCarton(c) {
  const o = D.open.get(c), p = cartonProg(c), ls_ = D.byCarton.get(c);
  const d = dialog(`<h2><span class="mono">${short(c)}</span> ${o ? `<span class="tag ${o.status === 'done' ? 'done' : ''}">${o.status === 'done' ? 'kész' : 'nyitott'}</span>` : '<span class="tag mute">nincs felvéve</span>'}</h2>
    <div class="meta" style="margin-bottom:var(--s3)">${esc(c)} ${awbTag(ls_[0])} ${o ? '· felvette: ' + esc(o.opened_by || '') + ' · ' + fmtDT(o.opened_at) : ''}${o && o.place ? ' · hely: ' + esc(o.place) : ''}</div>
    <div class="card scroll" style="max-height:340px">${ls_.map(l => `<button class="lrow" data-line="${l.id}" data-v="${isLineDone(l) ? 0 : 1}" aria-pressed="${isLineDone(l)}" ${o ? '' : 'disabled'}>
      <span class="box">${isLineDone(l) ? ic('check') : ''}</span><span class="t"><b class="mono">${esc(l.sku)}</b><br>${esc(l.descr)}${l.mat ? ' <span class="meta">(' + esc(l.mat) + ')</span>' : ''}</span><b>${l.qty} db</b></button>`).join('')}</div>
    <div class="meta">${p.done}/${p.n} tétel kész, ${p.qty} db várt, kb. ${ls_.reduce((a, l) => a + (l.gw || 0), 0).toFixed(1)} kg bruttó</div>
    <div class="row"><button class="btn" id="cx">Bezár</button>
      ${o ? `${o.status === 'done' ? '<button class="btn" id="cr">Újranyitás</button>' : '<button class="btn pri" id="cd">Doboz kész</button>'}<button class="btn dng" id="cz">Eltávolítás a listáról</button>` : '<button class="btn pri" id="co">Felvétel</button>'}</div>`);
  const act = async (a) => { if (await adm('rk_admin_carton', {p_carton: c, p_action: a})) { await loadOpen(); render(true); showCarton(c); } };
  d.querySelectorAll('[data-line]').forEach(b => b.onclick = async () => { const r = await sb.rpc('rk_set_line', {p_line: +b.dataset.line, p_done: b.dataset.v === '1', p_device: 'admin'}); if (!r.error) { await loadOpen(); render(true); showCarton(c); } });
  d.querySelector('#cx').onclick = () => d.close();
  [['cr', 'reopen'], ['cd', 'done'], ['co', 'open']].forEach(([id, a]) => { const b = d.querySelector('#' + id); if (b) b.onclick = () => act(a); });
  const cz = d.querySelector('#cz'); if (cz) cz.onclick = async () => { if (await confirmDlg('Biztosan eltávolítod a dobozt a nyitott listáról? A tétel-állapotai is törlődnek.', 'Eltávolítás', true)) act('remove'); else showCarton(c); };
}

function skuTable(rows) {
  return `<table><thead><tr><th>SKU</th><th>Termék</th><th class="n">Doboz</th><th class="n">Nyitott</th><th class="n">Db</th></tr></thead><tbody>${rows.map(k => {
    const ls_ = D.byKey.get(k), op = ls_.filter(l => cartonStatus(l.carton) === 'open' && !isLineDone(l)).length;
    return `<tr class="clk" data-k="${k}"><td class="mono"><b>${esc(k)}</b></td><td>${esc(ls_[0].descr)}</td><td class="n">${ls_.length}</td><td class="n">${op ? `<span class="tag done">${op}</span>` : '0'}</td><td class="n">${ls_.reduce((a, l) => a + l.qty, 0)}</td></tr>`;
  }).join('')}</tbody></table>`;
}
function vSkus() {
  $('#main').innerHTML = `<div class="tools"><input class="inp" id="sq" placeholder="SKU részlete vagy terméknév" value="${esc(F.sq)}" aria-label="SKU keresés" style="width:340px"><span class="meta" id="sc"></span></div>
    <div class="cols"><div class="card"><h2 id="sh"></h2><div class="scroll" id="sr"></div></div>
    <div class="card"><h2>Többértelmű SKU-k (több nyitott dobozban hiányzik)</h2><div class="scroll">${(() => { const a = ambiguous(); return a.length ? skuTable(a.map(x => x.key)) : '<div class="empty">Nincs többértelmű SKU a nyitott dobozok között.</div>'; })()}</div></div></div>`;
  const fill = () => {
    const q = F.sq.trim().toLowerCase(); let keys = [...D.byKey.keys()];
    if (q) keys = keys.filter(k => k.includes(q.replace(/\D/g, '') || '\u0000') || D.byKey.get(k)[0].descr.toLowerCase().includes(q));
    else keys = keys.sort((a, b) => D.byKey.get(b).length - D.byKey.get(a).length);
    $('#sh').textContent = q ? 'Találatok' : 'Legtöbb dobozban szereplő SKU-k';
    $('#sc').textContent = q ? keys.length + ' találat' : '';
    $('#sr').innerHTML = keys.length ? skuTable(keys.slice(0, 120)) : '<div class="empty">Nincs találat.</div>';
  };
  fill();
  $('#sq').oninput = e => { F.sq = e.target.value; fill(); };
  $('#main').onclick = e => { const r = e.target.closest('[data-k]'); if (r) showSku(r.dataset.k); };
}
function showSku(k) {
  const ls_ = D.byKey.get(k);
  const d = dialog(`<h2><span class="mono">${esc(k)}</span> ${esc(ls_[0].descr)}</h2><div class="meta" style="margin-bottom:var(--s3)">${ls_.length} dobozban, összesen ${ls_.reduce((a, l) => a + l.qty, 0)} db${ls_[0].mat ? ' · ' + esc(ls_[0].mat) : ''}</div>
    <div class="card scroll" style="max-height:380px"><table><thead><tr><th>Doboz</th><th>AWB</th><th>Státusz</th><th class="n">Db</th></tr></thead><tbody>${ls_.map(l => {
      const s = cartonStatus(l.carton);
      return `<tr class="clk" data-c="${esc(l.carton)}"><td><b class="mono">${short(l.carton)}</b></td><td>${awbTag(l)}</td><td>${s ? `<span class="tag ${s === 'done' || isLineDone(l) ? 'done' : ''}">${isLineDone(l) ? 'tétel kész' : s === 'done' ? 'kész' : 'nyitott'}</span>` : '<span class="tag mute">nincs felvéve</span>'}</td><td class="n">${l.qty}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="row"><button class="btn" id="cx">Bezár</button></div>`);
  d.querySelector('#cx').onclick = () => d.close();
  d.querySelectorAll('[data-c]').forEach(r => r.onclick = () => showCarton(r.dataset.c));
}

function vDiffs() {
  const sk = skuScans();
  const agg = (rows, keyf) => { const m = new Map(); rows.forEach(s => { const k = keyf(s), x = m.get(k) || {k, n: 0, last: 0, dev: new Set()}; x.n++; x.last = Math.max(x.last, +new Date(s.ts)); x.dev.add(s.device); m.set(k, x); }); return [...m.values()].sort((a, b) => b.n - a.n); };
  const unk = agg(sk.filter(s => s.result === 'unknown'), s => s.raw);
  const cl = agg(sk.filter(s => s.result === 'closed' || s.result === 'surplus'), s => s.key || s.raw);
  const ucart = agg(SC.filter(s => s.kind === 'carton' && s.result === 'unknown'), s => s.raw);
  const miss = missingLines();
  const tbl = (rows, nameF) => rows.length ? `<table><thead><tr><th>Kód</th><th class="n">Szkennelés</th><th>Eszköz</th><th>Utoljára</th></tr></thead><tbody>${rows.map(x => `<tr><td>${nameF(x)}</td><td class="n">${x.n}</td><td>${esc([...x.dev].join(', '))}</td><td class="meta">${fmtT(x.last)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nincs ilyen.</div>';
  $('#main').innerHTML = `<div class="tiles">${tile('Ismeretlen termékkód', unk.length, 'nincs a goodslistben')}${tile('Nincs nyitott dobozban', cl.length, 'felesleg vagy nem felvett doboz')}${tile('Ismeretlen doboz', ucart.length, 'címke nincs a goodslistben')}${tile('Hiányzó tétel', miss.length, `${miss.reduce((a, l) => a + l.qty, 0)} db a nyitott dobozokban`)}</div>
    <div class="cols">
      <div class="card"><h2>Ismeretlen termékkódok</h2><div class="scroll">${tbl(unk, x => `<b class="mono">${esc(x.k)}</b>`)}</div></div>
      <div class="card"><h2>Nincs nyitott dobozban (felesleg vagy hiányzó doboz-felvétel)</h2><div class="scroll">${tbl(cl, x => { const l = D.byKey.get(x.k); return `<b class="mono">${esc(x.k)}</b>${l ? '<br><span class="meta">' + esc(l[0].descr) + '</span>' : ''}`; })}</div></div>
      <div class="card"><h2>Ismeretlen dobozok</h2><div class="scroll">${tbl(ucart, x => `<b class="mono">${esc(x.k)}</b>`)}</div></div>
      <div class="card"><h2>Hiányzó tételek a nyitott dobozokból <button class="btn xs" id="ex" style="margin-left:auto">${ic('dl')}CSV</button></h2><div class="scroll"><table><thead><tr><th>Doboz</th><th>SKU</th><th>Termék</th><th class="n">Db</th></tr></thead><tbody>${miss.slice(0, 300).map(l => `<tr><td class="mono"><b>${short(l.carton)}</b></td><td class="mono">${esc(l.sku)}</td><td>${esc(l.descr)}</td><td class="n">${l.qty}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nincs hiányzó tétel.</td></tr>'}</tbody></table>${miss.length > 300 ? `<div class="pg">Az első 300 sor látszik, a teljes lista a CSV-ben van.</div>` : ''}</div></div>
    </div>`;
  $('#ex').onclick = () => csv([['AWB', 'Doboz', 'SKU', 'Termék', 'Anyag', 'Db']].concat(miss.map(l => [l.awb, l.carton, l.sku, l.descr, l.mat, l.qty])), 'hianyzo_tetelek.csv');
}

function vLog() {
  const LG = {hit: s => s.result === 'open1' || s.result === 'openN', miss: s => s.result === 'closed' || s.result === 'surplus', unknown: s => s.result === 'unknown', carton: s => s.kind === 'carton', line: s => s.kind === 'line'};
  const flt = () => SC.filter(s => (!F.lres || LG[F.lres](s)) && (!F.lq || (s.raw || '').includes(F.lq) || (s.device || '').toLowerCase().includes(F.lq.toLowerCase()) || (s.carton || '').includes(F.lq)));
  const rows = flt();
  $('#main').innerHTML = `<div class="tools"><input class="inp" id="lq" placeholder="Kód, eszköz vagy doboz" value="${esc(F.lq)}" aria-label="Szűrés">
    ${[['', 'Mind'], ['hit', 'Találat'], ['miss', 'Nincs nyitott'], ['unknown', 'Ismeretlen'], ['carton', 'Dobozok'], ['line', 'Tételek']].map(([k, n]) => `<button class="chip" data-lr="${k}" aria-pressed="${F.lres === k}">${n}</button>`).join('')}
    <span class="meta" id="lc"></span><button class="btn sm" id="ex" style="margin-left:auto">${ic('dl')}Export CSV</button></div>
    <div class="card"><div class="scroll" style="max-height:none" id="lt"></div></div>`;
  const fill = () => {
    const r = flt();
    $('#lc').textContent = r.length + ' bejegyzés (az utolsó 2000-ből)';
    $('#lt').innerHTML = `<table><thead><tr><th>Idő</th><th>Eszköz</th><th>Típus</th><th>Kód</th><th>Eredmény</th><th>Doboz</th></tr></thead><tbody>${r.slice(0, 500).map(s => `<tr><td class="mono">${fmtDT(s.ts)}</td><td>${esc(s.device)}</td><td>${esc(s.kind)}</td><td class="mono">${esc(s.raw)}</td><td>${resTag(s.result)}</td><td class="mono">${s.carton ? esc(short(s.carton)) : ''}</td></tr>`).join('')}</tbody></table>`;
  };
  fill();
  $('#lq').oninput = e => { F.lq = e.target.value.trim(); fill(); };
  document.querySelectorAll('[data-lr]').forEach(b => b.onclick = () => { F.lres = b.dataset.lr; vLog(); });
  $('#ex').onclick = () => csv([['Idő', 'Eszköz', 'Típus', 'Kód', 'SKU kulcs', 'Eredmény', 'Doboz']].concat(rows.map(s => [s.ts, s.device, s.kind, s.raw, s.key, s.result, s.carton])), 'naplo.csv');
}

function vDevices() {
  const dv = devStats(), now = Date.now();
  $('#main').innerHTML = `<div class="card"><table><thead><tr><th>Eszköz</th><th>Állapot</th><th class="n">Szkennelés</th><th class="n">Találat</th><th class="n">Felvett doboz</th><th class="n">Kész tétel</th><th>Utoljára</th></tr></thead><tbody>${dv.map(d => `<tr>
    <td><b>${esc(d.name)}</b></td><td>${now - d.last < 5 * 60e3 ? '<span class="tag done">aktív</span>' : '<span class="tag mute">nem aktív</span>'}</td><td class="n">${d.scans}</td>
    <td class="n">${d.sku ? pct(d.hit, d.sku) : ''}</td><td class="n">${d.opened}</td><td class="n">${d.lines}</td><td class="meta">${fmtDT(d.last)}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Még nincs szkennelés.</td></tr>'}</tbody></table></div>
    <p class="help">Az eszközök a naplóból látszanak: egy PDA az első szkennelése után jelenik meg itt. A nevét a PDA-n a fejlécben lehet átírni.</p>`;
}

function vLabels() {
  const base = F.lmode === 'felvett' ? [...D.open.keys()] : F.lmode === 'nyitott' ? [...D.open.values()].filter(o => o.status === 'open').map(o => o.carton) : [];
  $('#main').innerHTML = `<div class="card pad"><div class="lblform">
    <div class="field"><span>Forrás</span><div style="display:flex;gap:var(--s2)">${[['felvett', 'Minden felvett'], ['nyitott', 'Csak nyitott'], ['lista', 'Beírt lista']].map(([k, n]) => `<button class="chip" data-lm="${k}" aria-pressed="${F.lmode === k}">${n}</button>`).join('')}</div></div>
    <label class="field"><span>Szélesség (mm)</span><input id="lw" type="number" value="${ls.get('rk_lw') || 100}" min="30"></label>
    <label class="field"><span>Magasság (mm)</span><input id="lh" type="number" value="${ls.get('rk_lh') || 50}" min="20"></label>
    <button class="btn pri" id="pr">${ic('print')}Nyomtatás</button></div>
    ${F.lmode === 'lista' ? `<label class="field"><span>Doboz azonosítók (soronként vagy vesszővel, teljes vagy az utolsó számjegyek)</span><textarea class="inp" id="ll">${esc(F.ltxt || '')}</textarea></label>` : ''}
    <div class="meta" id="lcnt"></div></div>
    <p class="help">A címke a doboz utolsó 6 számjegyét nagyban, alatta a teljes azonosítót Code 128 vonalkóddal tartalmazza. A nyomtató beállításainál válaszd ki a címke méretét, és kapcsold ki a margót.</p>`;
  const items = () => {
    if (F.lmode !== 'lista') return base.sort();
    const t = (F.ltxt || '').split(/[\s,;]+/).filter(Boolean), out = [];
    t.forEach(x => { const d = x.replace(/\D/g, ''); const m = D.cartonByDigits.get(d) || [...D.byCarton.keys()].find(c => d.length >= 4 && c.endsWith(d)); if (m && !out.includes(m)) out.push(m); });
    return out;
  };
  const upd = () => $('#lcnt').textContent = items().length + ' címke készül';
  upd();
  document.querySelectorAll('[data-lm]').forEach(b => b.onclick = () => { F.lmode = b.dataset.lm; vLabels(); });
  const ll = $('#ll'); if (ll) ll.oninput = e => { F.ltxt = e.target.value; upd(); };
  $('#pr').onclick = () => {
    const w = +$('#lw').value || 100, h = +$('#lh').value || 50, list = items();
    if (!list.length) return toast('Nincs nyomtatható doboz');
    ls.set('rk_lw', w); ls.set('rk_lh', h);
    $('#labels').innerHTML = `<style>@page{size:${w}mm ${h}mm;margin:0}.lbl{width:${w}mm;height:${h}mm;--lbl-big:${Math.round(h * .42)}mm}</style>` +
      list.map(c => `<div class="lbl"><div class="big">${short(c)}</div><svg class="bc" data-v="${esc(c)}"></svg><div class="sm">${esc(c)} ${esc((D.awbs.get(D.byCarton.get(c)[0].awb) || {}).mark || '')}</div></div>`).join('');
    document.querySelectorAll('#labels svg.bc').forEach(s => { try { JsBarcode(s, s.dataset.v, {format: 'CODE128', displayValue: false, height: Math.round(h * 0.9), width: 2, margin: 0}); } catch (e) {} });
    window.print();
  };
}

function vSettings() {
  const aw = [...D.awbs.values()];
  $('#main').innerHTML = `<div class="cols">
    <div class="card"><h2>Betöltött AWB-k</h2>${aw.map(a => `<div class="list-row"><div class="grow"><b>${esc(a.mark || '')}</b> <span class="meta mono">${esc(a.id)}</span><div class="meta">${new Set(D.lines.filter(l => l.awb === a.id).map(l => l.carton)).size} doboz, ${D.lines.filter(l => l.awb === a.id).length} sor · feltöltve ${fmtDT(a.loaded_at)}</div></div>
      <button class="btn sm dng" data-del="${esc(a.id)}">Törlés</button></div>`).join('') || '<div class="empty">Nincs betöltött AWB.</div>'}
      <div class="pad meta">Új goodslist feltöltése: futtasd a gépeden az upload.py-t az xlsx fájlokkal. A PDA-k pár másodpercen belül frissülnek.</div></div>
    <div><div class="card pad"><b>Admin kód módosítása</b><label class="field" style="margin-top:var(--s3)"><span>Új kód (legalább 6 karakter)</span><input id="nc" type="password" autocomplete="off"></label><button class="btn pri" id="sc">Mentés</button></div>
      <div class="card pad"><b>Törlés</b><p class="help">A goodslist megmarad.</p><div class="row" style="justify-content:flex-start;margin:0"><button class="btn dng" data-rs="open">Felvett dobozok és tételek</button><button class="btn dng" data-rs="scans">Napló</button></div></div>
      <div class="card pad"><b>Megjelenés</b><div class="row" style="justify-content:flex-start"><button class="chip" data-th="">Rendszer</button><button class="chip" data-th="light">Világos</button><button class="chip" data-th="dark">Sötét</button></div></div>
      <button class="btn" id="out">Kilépés az admin módból</button></div></div>`;
  $('#main').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
    if (d.del) { if (await confirmDlg(`Biztosan törlöd ezt az AWB-t (${d.del}) és a hozzá tartozó felvett dobozokat?`, 'Törlés', true) && await adm('rk_admin_delete_awb', {p_awb: d.del})) { toast('AWB törölve'); await tick(true); } }
    if (d.rs) { if (await confirmDlg(d.rs === 'open' ? 'Törlöd az összes felvett dobozt és tétel-állapotot? Nem vonható vissza.' : 'Törlöd a teljes naplót?', 'Törlés', true) && await adm('rk_admin_reset', {p_what: d.rs})) { toast('Törölve'); await tick(); } }
    if (d.th !== undefined && b.classList.contains('chip')) { if (d.th) document.documentElement.dataset.theme = d.th; else delete document.documentElement.dataset.theme; ls.set('rk_theme', d.th); }
    if (b.id === 'sc') { const v = $('#nc').value, r = await adm('rk_admin_set_code', {p_new: v}); if (r && r.ok) { adminCode = v; ls.set('rk_admin', v); toast('Kód módosítva'); } else if (r) toast('A kód túl rövid'); }
    if (b.id === 'out') { adminCode = ''; ls.del('rk_admin'); login(); }
  };
}

// ---------- inditas ----------
async function tick(full) {
  await refreshData(!!full);
  await loadScans();
  loading = false; render();
}
const th = ls.get('rk_theme'); if (th) document.documentElement.dataset.theme = th;
$('#rf').onclick = () => tick(true);
if (!adminCode) login();
if (loadCache()) loading = false;
render();
tick(true);
setInterval(() => tick(false), 6000);
watch(() => render());
</script>
</body>
</html>
